/* Composition = the Figma frame (1920×1080). Everything scales by --s; UI anchors to the viewport edges with 64-unit padding. */
:root {

  --paper: #ffffff;

  --num-family: "narkiss-yair-variable"; --num-weight: 400; --num-stretch: normal; --num-style: normal; --num-vars: "MONO" 100;

html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--blue); }

/* ---------- composition text (positions from Figma) ---------- */
.frame-ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.headline {
  position: absolute; margin: 0;
  top: calc(64px * var(--s) + env(safe-area-inset-top, 0px)); right: calc(64px * var(--s) + env(safe-area-inset-right, 0px));
  width: calc(696.035px * var(--s));
  font-family: var(--display-family), "tel-aviv-brutalist", "Arial Black", "Arial Hebrew", sans-serif;
  font-weight: var(--display-weight); font-stretch: var(--display-stretch); font-style: var(--display-style);
  font-size: calc(95px * var(--s)); line-height: .8;   /* two lines (<br> in the markup); the longer one fills the 696 box */
  color: var(--paper); text-align: right; direction: rtl; word-break: break-word;
  -webkit-text-stroke: calc(5px * var(--s)) var(--ink); paint-order: stroke fill; /* 2.5 outside stroke */
  text-box: trim-both cap alphabetic;
}
/* desktop (the landscape layout, W/H ≥ 0.9 as in layout()): 15% larger; the box follows the longer line instead of 696 */
@media (min-aspect-ratio: 9/10) {
  .headline { font-size: calc(109.25px * var(--s)); width: max-content; }
}
.counter {
  position: absolute;
  left: calc(64px * var(--s) + env(safe-area-inset-left, 0px)); bottom: calc(64px * var(--s) + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border: calc(2.5px * var(--s)) solid #000;
  padding: calc(16px * var(--s));
  display: flex; flex-direction: column; align-items: center; gap: calc(33px * var(--s));
  color: var(--count-color); line-height: .8; white-space: nowrap;
  transition: color .6s, opacity .4s;
}
.counter.waiting { opacity: 0; }   /* until the real count arrives: never a flash of 0 */
.counter b {
  font-family: var(--num-family), "narkiss-yair-variable", "narkiss-yair", "Narkiss Yair Variable", "Arial Hebrew", sans-serif;
  font-weight: var(--num-weight); font-stretch: var(--num-stretch); font-style: var(--num-style);
  font-variation-settings: var(--num-vars);

.share {

  left: calc(64px * var(--s) + env(safe-area-inset-left, 0px)); top: calc(64px * var(--s) + env(safe-area-inset-top, 0px));

/* the note is the paper itself: the size and the slot's 30° shear it has going into the box, from the start.

.note-paper {

  font-weight: 700; line-height: 1.05; overflow-wrap: break-word;
  will-change: transform; transition: opacity .15s;
}
.note-paper span { width: 100%; }
.note-paper::before { content: ""; position: absolute; inset: -14px; }   /* easier to grab on touch */
.note-paper[hidden] { display: none; }
.note-paper.off { opacity: 0; }
@media (hover: none) { .note-paper { pointer-events: auto; touch-action: none; } }
.following, .following #boxBtn { cursor: none; }

/* ---------- font combos overlay ---------- */
.combos {

  <div class="combos-grid" id="combosGrid"></div>

    spike: { head: (r, R, n, i) => spikeHead(R * 2.2, i % 2 ? BLUE : PINK, n), h: [35, 55], flex: 0.9 },
  };
  function flowerVariant(r, o, i, tilt = r() * 0.4, az = r() * TAU) {
    const span = ([a, b]) => a + r() * (b - a);
    const h = span(o.h || [45, 70]) * Z, R = span(o.R || [12, 20]);
    const p0 = [0, 0, 0], p2 = mul3(dirAt(az, tilt), h), p1 = [p2[0] * 0.4, p2[1] * 0.4, p2[2] * 0.6];   // leans from the base, arcs out at the top
    const look = o.look || 0, jit = [r() - 0.5, r() - 0.5, r() - 0.5];
    const n = norm3(add3(add3(mul3(norm3(sub3(p2, p1)), 1 - look), mul3(EYE, look)), mul3(jit, 0.5)));
    const leaves = [{ t: 0.3 + r() * 0.15, az: r() * TAU, L: R * 1.3 }];
    if (o.twoLeaves || r() < 0.3) leaves.push({ t: 0.12 + r() * 0.1, az: leaves[0].az + Math.PI + (r() - 0.5) * 0.8, L: R * 1.1 });
    // each leaf is kept around its own attachment point, so the bouquet can move it with the stem
    const lvs = leaves.map(lf => ({ at: qb3(p0, p1, p2, lf.t), front: Math.sin(lf.az) >= 0, part: { list: leaf3([0, 0, 0], lf.az, lf.L, GRASS) } }));

  }

  // ---------- species: each variant = body (+ head, + full = both, for flowers) ----------
  const SPECIES = {};
  function addSpecies(name, n, make) { SPECIES[name] = []; const r = mulberry(name.length * 7919 + n); for (let i = 0; i < n; i++) SPECIES[name].push(make(r, i)); }

  function defineSpecies() {
    addSpecies('grass', 12, r => {
      const nb = 4 + Math.floor(r() * 4), col = r() < 0.6 ? GRASS : GRASS_DK, L = [];
      for (let k = 0; k < nb; k++) { const az = r() * TAU; L.push(blade(mul3(flatDir(az), 2 + r() * 5), az + (r() - 0.5) * 1.2, (12 + r() * 24) * Z, 4 + r() * 10, 6 + r() * 3, col)); }
      return { flex: 1.1, body: { list: byDepth(L) } };
    });
    addSpecies('reed', 6, r => {
      const L = [];
      for (let k = 0; k < 3; k++) { const az = r() * TAU; L.push(blade(mul3(flatDir(az), 3), az, (38 + r() * 34) * Z, 5 + r() * 9, 6, GRASS_DK)); }
      const top = mul3(dirAt(r() * TAU, r() * 0.18), (60 + r() * 22) * Z), ctl = [top[0] * 0.2, top[1] * 0.2, top[2] * 0.6], T = norm3(sub3(top, ctl));
      L.push(wire(curve3([0, 0, 0], ctl, top, 8)), rod(add3(top, mul3(T, 2)), add3(top, mul3(T, 15)), 4, TAN));
      return { flex: 1.3, body: { list: byDepth(L) } };
    });
    addSpecies('clover', 6, r => {
      const L = [], sprigs = [], n = 3 + Math.floor(r() * 3);
      for (let k = 0; k < n; k++) sprigs.push([(r() - 0.5) * 22, (r() - 0.5) * 16, (7 + r() * 10) * Z]);
      for (const top of sprigs) {
        const leaves = [], turn = r() * TAU;
        for (let i = 0; i < 3; i++) {   // three leaflets, drooping a little outward
          const d = flatDir(turn + i / 3 * TAU), nrm = norm3(add3(UP, mul3(d, 0.45))), [u, w] = basis(nrm);
          leaves.push(shape(ring3(add3(top, mul3(d, 4.2)), u, w, 4.6, 4.6, 14), lit(GRASS, nrm)));
        }
        L.push(...group([wire([[top[0], top[1], 0], top]), ...byDepth(leaves)], dot3(top, EYE)));
      }
      if (r() < 0.45) { const [x, y, h] = sprigs[0]; L.push(...group([wire([[x + 2, y, 0], [x + 3, y, h + 9 * Z]]), ball([x + 3, y, h + 12 * Z], 5, WHITE)], dot3(sprigs[0], EYE) + 0.5)); }
      return { flex: 0.5, body: { list: byDepth(L) } };
    });
    addSpecies('bush', 8, r => {
      const Wd = 40 + r() * 34, Hh = 30 + r() * 26, L = [], turn = r() * TAU;
      const balls = [0, 1, 2, 3].map(i => { const d = flatDir(turn + i / 4 * TAU); return [d[0] * Wd * 0.27, d[1] * Wd * 0.27, Hh * 0.38 * Z, Wd * 0.3 * (0.9 + r() * 0.2)]; });
      balls.push([0, 0, Hh * 0.66 * Z, Wd * 0.33]);
      const dc = [WHITE, PINK, YEL][Math.floor(r() * 3)], dots = r() < 0.65;
      for (const [x, y, z, R] of balls) {
        const c = [x, y, z], parts = [ball(c, R, BUSH)];
        if (dots) for (let j = 0; j < 2; j++) parts.push(ball(add3(c, mul3(norm3(add3([r() - 0.5, r() - 0.5, r() - 0.3], EYE)), R * 0.8)), 4.2, dc));
        L.push(...group(parts, dot3(c, EYE)));
      }
      return { flex: 0.12, body: { list: byDepth(L) } };
    });
    addSpecies('fern', 4, r => {
      const L = [], turn = r() * TAU;
      for (let k = 0; k < 7; k++) {   // fronds arch up and out all around, leaflets along both sides
        const out = flatDir(turn + k / 7 * TAU + (r() - 0.5) * 0.4), len = 30 + r() * 16;
        const p0 = [0, 0, 0], p1 = add3(mul3(out, len * 0.35), [0, 0, len * 0.9 * Z]), p2 = add3(mul3(out, len), [0, 0, len * 0.3]);
        const frond = [wire(curve3(p0, p1, p2, 10))];
        for (let t = 0.25; t < 0.95; t += 0.18) {
          const p = qb3(p0, p1, p2, t), tan = norm3(sub3(qb3(p0, p1, p2, t + 0.02), p)), side = norm3(cross3(tan, UP)), ll = 12 * (1.1 - t);
          for (const sd of [-1, 1]) {
            const ax = norm3(add3(add3(mul3(side, sd), mul3(tan, 0.35)), [0, 0, 0.3])), wv = norm3(cross3(cross3(ax, tan), ax));
            frond.push(shape(ring3(add3(p, mul3(ax, ll * 0.5)), ax, wv, ll * 0.5, 3.4, 10), lit(GRASS_DK, cross3(ax, tan))));
          }
        }
        L.push(...group(frond, dot3(qb3(p0, p1, p2, 0.6), EYE)));
      }
      return { flex: 0.7, body: { list: byDepth(L) } };
    });
    addSpecies('bells', 4, r => {
      const h = 45 + r() * 20, col = r() < 0.5 ? WHITE : BLUE, az = r() * TAU, out = flatDir(az);
      const p0 = [0, 0, 0], p1 = add3(mul3(out, 4), [0, 0, h * 1.1 * Z]), p2 = add3(mul3(out, h * 0.45), [0, 0, h * 0.82 * Z]);
      const L = [...leaf3(qb3(p0, p1, p2, 0.25), az + Math.PI + 0.3, 16, GRASS), wire(curve3(p0, p1, p2, 10))];
      for (const t of [0.55, 0.75, 0.95]) L.push(...bell(qb3(p0, p1, p2, t), col));
      return { flex: 0.8, body: { list: L } };
    });
    addSpecies('sabra', 3, r => {
      const L = [];
      // pads: [x, y, height, rx, ry, roll]; each faces its own way and has a thickness
      for (const [x, y, zh, rx, ry, roll] of [[0, 0, 16, 10, 16, 0], [-10, -2, 40, 8, 12, -0.45], [10, 2, 38, 8.5, 12.5, 0.4], [1, -1, 60, 7, 10, 0.05]]) {
        const nrm = norm3([...flatDir(r() * TAU).slice(0, 2), (r() - 0.5) * 0.3]), u0 = norm3(cross3(UP, nrm)), w0 = cross3(nrm, u0);
        const u = add3(mul3(u0, Math.cos(roll)), mul3(w0, Math.sin(roll))), w = add3(mul3(u0, -Math.sin(roll)), mul3(w0, Math.cos(roll)));
        const c = [x, y, zh * Z], f = dot3(nrm, EYE) < 0 ? -1 : 1, face = add3(c, mul3(nrm, f * 1.5));
        const pad = [shape(ring3(add3(c, mul3(nrm, -f * 1.5)), u, w, rx, ry, 20), shade(TREE)), shape(ring3(face, u, w, rx, ry, 20), lit(TREE, nrm))];
        for (const [a, b] of [[-0.4, -0.3], [0, 0.35], [0.4, -0.25]]) pad.push(shape(ring3(add3(add3(face, mul3(u, a * rx)), mul3(w, b * ry)), u, w, 0.9, 0.9, 6), INK, 0));

      return { flex: 0.03, body: { list: byDepth(L) } };
    });
    for (const [name, o] of Object.entries(FLOWERS)) addSpecies(name, 8, (r, i) => flowerVariant(r, o, i));
  }

  // ---------- paper on the colours ----------
  // The .grain layer screens the paper over everything, which only shows on dark colours. The lawn and the
  // plants also get the paper multiplied in (black, with the paper's fibres as alpha), so it shows on light ones.
  const PAPER_FIBRE = [24, 2.5];   // paper value where the fibres start, and how dark they get: ~8% darker on average
  let PAPER_C = null;
  const paperImg = new Image();
  paperImg.onload = () => {
    const c = document.createElement('canvas'); c.width = paperImg.naturalWidth; c.height = paperImg.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(paperImg, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
    for (let i = 0; i < px.length; i += 4) { px[i + 3] = clamp((px[i + 1] - PAPER_FIBRE[0]) * PAPER_FIBRE[1], 0, 150); px[i] = px[i + 1] = px[i + 2] = 0; }
    g.putImageData(d, 0, 0);
    PAPER_C = c;
    if (W) { buildSprites(); layersDirty = lawnDirty = dirty = true; }
  };
  paperImg.src = 'paper.jpg';
  // the paper over whatever g already has; k = canvas px per paper px (the .grain layer: cover, so DPR · paperK())
  const paperK = () => Math.max(W / 1920, H / 1080) * DPR;
  function paperOn(g, k, x, y) {
    if (!PAPER_C) return;
    const pat = g.createPattern(PAPER_C, 'repeat');
    pat.setTransform(new DOMMatrix([k, 0, 0, k, x, y]));
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-atop';
    g.fillStyle = pat; g.fillRect(0, 0, g.canvas.width, g.canvas.height); g.restore();
  }

  // render every variant into bitmaps at the current scale: the plant, and its shadow
  let SPR = 1;
  function raster(part, ls, toSh = toShadow) {
    const pad = 4, k = SPR;
    const mk = sh => {
      const P = sh ? toSh : toScreen, b = listBounds(part.list, P), c = document.createElement('canvas');
      c.width = Math.max(1, Math.ceil((b.x1 - b.x0 + pad * 2) * k)); c.height = Math.max(1, Math.ceil((b.y1 - b.y0 + pad * 2) * k));
      const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, (pad - b.x0) * k, (pad - b.y0) * k); drawList(g, part.list, sh, ls, P);
      if (!sh) paperOn(g, paperK() * 1.25, -Math.random() * 1920, -Math.random() * 1080);   // sprites are drawn at 1/1.25
      return { c, ax: pad - b.x0, ay: pad - b.y0 };
    };
    part.img = mk(false); part.sil = mk(true);
  }
  function buildSprites() {
    SPR = DPR * sc * 1.25 * PLANT_K;
    for (const list of Object.values(SPECIES)) for (const v of list) for (const part of [v.body, v.head, v.full]) if (part) raster(part, LINE_K / PLANT_K);
    for (const p of slotPlants) for (const part of [p.v.head, ...p.v.leaves.map(l => l.part)]) raster(part, LINE_K, toGround);   // the bouquet keeps its size relative to the box
  }

  // ---------- how votes turn into flowers ----------
  // Notes 1–30 grow the bouquet out of the slot, one flower each. From note SPROUT on, islands sprout
  // around the box and every note also releases a handful of flowers into them (FIELD flowers spread
  // over the notes up to GOAL); a patch grows just enough to hold the flowers it has.
  // The whole ground is green at GOAL.
  const SLOT_MAX = 30, SPROUT = Math.max(2, CONFIG.sprout || 6), FIELD = 900;
  const GRID = 300, RMIN = 55;
  let patches = [], plants = [], voteFlower = [];
  const pwob = (p, a) => 1 + 0.06 * Math.sin(5 * a + p.ph1) + 0.035 * Math.sin(9 * a + p.ph2);

  const FLOWER_MIX = [['daisy', 0.2], ['anemone', 0.17], ['five', 0.25], ['tulip', 0.12], ['sunflower', 0.06], ['puff', 0.09], ['spike', 0.11]];
  function pickWeighted(r, mix) { let v = r(), acc = 0; for (const [k, w] of mix) { acc += w; if (v < acc) return k; } return mix[mix.length - 1][0]; }
  const blocked = pt => inPoly(pt, FOOT) || inPoly(pt, SHADOW_POLY);
  const hidden = pt => inPoly(pt, HULL) && !inFront(pt.x, pt.y);   // behind the box: fine for grass, not for a counted flower

  function genGarden() {
    const r = mulberry(20261027);
    patches = [];
    const rowH = GRID * 0.866 * ISO;
    const gx0 = Math.min(-520, view.x0 - 300), gx1 = Math.max(2440, view.x1 + 300);
    const gy0 = Math.min(-420, view.y0 - 200), gy1 = Math.max(1500, view.y1 + 200);
    for (let j = 0, y = gy0; y < gy1; j++, y += rowH)
      for (let x = gx0 + (j % 2) * GRID / 2; x < gx1; x += GRID)
        patches.push({ c: { x: x + (r() - 0.5) * GRID * 0.5, y: y + (r() - 0.5) * rowH * 0.5 }, rmax: 250 + r() * 70, ph1: r() * TAU, ph2: r() * TAU, rv: 0, vel: 0, wake: 0, flowers: [], votes: [] });

    // patches whose centre is on screen (and clear of the box) carry the counted flowers
    const onScreen = p => p.c.x > view.x0 + 20 && p.c.x < view.x1 - 20 && p.c.y > view.y0 + 10 && p.c.y < view.y1 - 10;
    const counted = patches.filter(p => onScreen(p) && !blocked(p.c) && !hidden(p.c));
    const deco = patches.filter(p => !counted.includes(p));
    counted.forEach(p => p.key = r()); counted.sort((a, b) => a.key - b.key);
    const anchor = { x: CENTER.x - 380, y: CENTER.y + 190 };
    const first = counted.reduce((b, p) => isoDist(p.c.x, p.c.y, anchor) < isoDist(b.c.x, b.c.y, anchor) ? p : b, counted[0]);
    counted.splice(counted.indexOf(first), 1); counted.unshift(first);

    plants = [];
    const add = (p, species, d, a, extra = {}) => {
      const x = p.c.x + d * Math.cos(a), y = p.c.y + d * Math.sin(a) * ISO;
      if (blocked({ x, y }) || (extra.vote === Infinity && hidden({ x, y }))) return null;
      const list = SPECIES[species];
      const pl = { patch: p, d, a, gx: x, gy: y, sp: species, v: list[Math.floor(r() * list.length)],
        front: inFront(x, y), born: undefined, delay: r() * 260, phase: r() * TAU, calm: CALM.has(species), ...extra };
      plants.push(pl);
      return pl;
    };
    const spot = (p, maxFrac = 0.98) => ({ d: Math.sqrt(r()) * p.rmax * maxFrac, a: r() * TAU });

    // flower capacity per counted patch, by area, adding up to FIELD
    const area = counted.reduce((s2, p) => s2 + p.rmax * p.rmax, 0);
    let left = FIELD;
    counted.forEach((p, i) => { p.cap = i === counted.length - 1 ? left : Math.max(1, Math.round(FIELD * p.rmax * p.rmax / area)); left -= p.cap; });

    for (const p of patches) {
      const isCounted = p.cap !== undefined;
      const nFl = isCounted ? p.cap : 12;
      for (let i = 0, tries = 0; i < nFl && tries < nFl * 30; tries++) {
        const q = spot(p), pl = add(p, pickWeighted(r, FLOWER_MIX), q.d, q.a, { flower: true, vote: isCounted ? Infinity : -1 });
        if (pl) { p.flowers.push(pl); i++; }
      }
      p.flowers.sort((a, b) => a.d - b.d);
      for (let i = 0; i < 4; i++) add(p, 'grass', r() * 42, r() * TAU);          // so a fresh sprout isn't bare
      for (let i = 0; i < 12; i++) { const q = spot(p); add(p, 'grass', q.d, q.a); }
      for (let i = 0; i < 2; i++) { const q = spot(p); add(p, 'reed', q.d, q.a); }
      for (let i = 0; i < 3; i++) { const q = spot(p); add(p, 'clover', q.d, q.a); }
      if (r() < 0.6) { const q = spot(p); add(p, 'fern', q.d, q.a); }
      if (r() < 0.7) { const q = spot(p); add(p, 'bush', q.d, q.a); }
      if (r() < 0.3) { const q = spot(p); add(p, 'bells', q.d, q.a); }
      if (r() < 0.07) { const q = spot(p); add(p, 'sabra', q.d, q.a); }
    }
    plants.sort((a, b) => a.gy - b.gy);

    // schedule: which flowers each note releases. A few islands open at SPROUT, the rest spread
    // over the notes up to `allOpen`; each note's flowers go to open islands by the room they have left.
    voteFlower = [];
    const open = [], allOpen = Math.round(SPROUT + (GOAL - SPROUT) * 0.88);
    let next = 0;
    const openOne = v => { const p = counted[next++]; p.T = v; open.push(p); };
    const room = () => open.reduce((s2, p) => s2 + (p.flowers.length - p.votes.length), 0);
    const share = v => Math.round(FIELD * (v - SPROUT + 1) / (GOAL - SPROUT + 1));
    for (let v = SPROUT; v <= GOAL; v++) {
      const want = v === SPROUT ? 4 : Math.ceil((counted.length - next) / Math.max(1, allOpen - v + 1));
      for (let k = 0; k < want && next < counted.length; k++) openOne(v);
      const batch = [];
      for (let n = share(v) - (v > SPROUT ? share(v - 1) : 0); n > 0; n--) {
        let left = room();
        if (left === 0 && next < counted.length) { openOne(v); left = room(); }
        if (left === 0) break;
        let pick = r() * left, chosen = null;
        for (const p of open) { pick -= p.flowers.length - p.votes.length; if (pick < 0) { chosen = p; break; } }
        if (!chosen) chosen = open.find(p => p.flowers.length > p.votes.length);
        const fl = chosen.flowers[chosen.votes.length];
        fl.vote = v; fl.seq = batch.length; chosen.votes.push(v); batch.push(fl);
      }
      voteFlower[v] = batch;
    }
    // patches off screen or under the box fill in over the last part
    deco.forEach((p, k) => { p.T = Math.round(GOAL * 0.75 + (k / Math.max(1, deco.length)) * GOAL * 0.17); p.deco = true; });
    lawnDirty = true;
  }

  function patchTarget(p, v) {
    if (p.T === undefined || v < p.T) return 0;
    if (p.deco || !p.flowers.length) return RMIN + (p.rmax - RMIN) * easeOut(clamp((v - p.T) / Math.max(1, GOAL - p.T)));
    let m = 0; while (m < p.votes.length && p.votes[m] <= v) m++;
    if (m === 0) return RMIN;
    if (m === p.flowers.length) return p.rmax + 10;
    return Math.max(RMIN, p.flowers[m - 1].d + 42);
  }

  // ---------- the bouquet that fills the box first ----------
  // Each note gets its own long-stemmed flower. The first ones stand up; later ones fan out
  // along the slot and lean forward or back out of it, like stems in a vase.
  let slotPlants = [];
  const TALL = { h: [110, 250], R: [18, 28], flex: 0.55 };
  const ALONG = norm3([1, 1, 0]), OUT = norm3([-1, 1, 0]);   // along the slot / out through the box's long face
  function genSlot() {
    const r = mulberry(4242);
    const kinds = [['daisy', 0.24], ['anemone', 0.2], ['five', 0.22], ['tulip', 0.12], ['sunflower', 0.07], ['spike', 0.09], ['puff', 0.06]];
    slotPlants = [];
    for (let i = 0; i < SLOT_MAX; i++) {
      const t = i === 0 ? 0.5 : 0.08 + ((i * 0.618034 + 0.27) % 1) * 0.84;
      const S0 = lerpPt(SLOT_A, SLOT_B, t);
      const sp = i === 0 ? 'daisy' : pickWeighted(r, kinds);
      const spread = Math.min(1, 0.45 + i / 10);
      const along = i === 0 ? 0 : ((t - 0.5) * 1.6 + (r() - 0.5) * 0.5) * spread, out = i === 0 ? 0.2 : (r() * 2 - 1) * spread;
      const lean = add3(mul3(ALONG, along), mul3(OUT, out));
      const v = flowerVariant(r, { ...FLOWERS[sp], ...TALL, ...(sp === 'sunflower' && { R: [22, 28] }) }, i, Math.min(0.9, Math.hypot(lean[0], lean[1]) * 0.75), Math.atan2(lean[1], lean[0]));
      // drawn back to front by where the head ends up
      slotPlants.push({ at: i + 1, gx: S0.x, gy: S0.y + H_LID, sp, v, born: undefined, delay: 0, phase: r() * TAU, z: S0.y / ISO * COS_E + dot3(v.top, EYE) });
    }
    slotPlants.sort((a, b) => a.z - b.z);
  }

  // ---------- wind ----------
  function windAt(x, y, t) {
    const base = Math.sin(t * 0.0013 + x * 0.005 + y * 0.003) * 0.35 + Math.sin(t * 0.0029 + x * 0.011) * 0.15;
    const span = 3400, front = ((t * 0.34) % span) - 800;          // a gust sweeping left → right
    const d = (x + y * 0.4) - front;
    return WIND * (0.05 * base + 0.2 * Math.exp(-(d * d) / (2 * 210 * 210)));
  }
  // the push on one plant per unit of its height, in world x/y (SWX, SWY): the shared gust, plus
  // its own sway at its own pace and a little across it, so neighbours don't move as one

  const lg = {};

  // ---------- state ----------
  // target: the real count (live, or simulated from the review panel). The garden (nGrow)
  // chases it one flower at a time; big jumps (first load, presets) bloom in all at once.
  let target = 0, nGrow = 0, inflight = 0, lastLaunch = 0, lastT = performance.now();
  let pending = null;            // own note sent, waiting for the server
  let voted = false;             // one note per page load
  const papers = [], seeds = [], rings = [];
  const numEl = document.getElementById('num');
  const shown = () => pending ? Math.max(target, pending.base + 1) : target;
  function showCount() { const v = shown(); numEl.textContent = v.toLocaleString('en-US'); syncPanel(v); }
  function setTarget(v) {

  }

  // ---------- vote: note → slot → (box full? seed → flower in a patch) ----------
  const PAPER_H = 200, PAPER_T = [0.1, 0.9], PAPER_MS = 720, SEED_MS = 760;   // PAPER_T: the paper's span along the slot
  function castVote() {

    }

  }
  function sendVote() {

  // ---------- lawn ----------

    for (let i = seeds.length - 1; i >= 0; i--) if (now - seeds[i].t0 > SEED_MS) {

  // ---------- live count ----------
  // live.js (Firebase) calls window.kalpiRemote(count) and provides window.kalpiVote().
  // Without it (a local file) the count lives in this page only.
  // The counter stays hidden until the first real number (no flash of 0); a returning visitor
  // starts from the last count this browser saw. A note cast before Firebase is ready waits for it.
  const LIVE = !!(CONFIG.firebase && CONFIG.firebase.projectId);
  let sim = false, liveCount = null, liveFailed = false, known = !LIVE;
  function markKnown() { if (!known) { known = true; counterEl.classList.remove('waiting'); } }
  // target is in shown units (live + OFFSET); liveCount stays the real number in the database
  window.kalpiRemote = v => {
    liveCount = v; if (!sim) setTarget(v + OFFSET); syncMode(); markKnown();
    try { localStorage.setItem('kalpi-count', String(v)); } catch (e) {}
  };
  window.kalpiLocal = () => { liveFailed = true; markKnown(); };
  const waitLive = () => new Promise(res => {
    const t0 = performance.now();
    const tick = () => window.kalpiVote || liveFailed || performance.now() - t0 > 8000 ? res() : setTimeout(tick, 100);
    tick();
  });
  const COUNTER = { vote: async () => {
    if (LIVE) await waitLive();
    return window.kalpiVote ? window.kalpiVote() : setTarget(target + 1);
  } };

  // ---------- review panel (only with ?review, or in the preview file) ----------
  const REVIEW = CONFIG.review || /review/.test(location.search + location.hash);
  const panel = document.getElementById('panel');
  if (!REVIEW) panel.hidden = true;
  const STATES = [['ריק', 0], ['פתק ראשון', 1], ['5', 5], ['איים · 6', 6], ['10', 10], ['20', 20], ['קלפי מלאה · 30', 30], ['45', 45], ['מלא · 60', 60]];
  const statesEl = document.getElementById('states');
  const modeEl = document.getElementById('mode'), backLive = document.getElementById('backLive');
  function simTo(v) { sim = true; setTarget(v); syncMode(); }
  STATES.forEach(([label, v]) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = label; b.dataset.v = v;
    b.addEventListener('click', () => { stopAuto(); papers.length = 0; simTo(v); });
    statesEl.appendChild(b);
  });
  const nRange = document.getElementById('nRange'), nOut = document.getElementById('nOut');
  nRange.max = GOAL;
  nRange.addEventListener('input', () => { stopAuto(); simTo(+nRange.value); });
  function syncPanel(v) {
    nRange.value = Math.min(v, GOAL); nOut.textContent = v.toLocaleString('en-US');
    statesEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
  }
  function syncMode() {
    const live = typeof window.kalpiVote === 'function';
    modeEl.textContent = sim ? 'סימולציה (רק אצלך)' : live ? `חי · ${liveCount ?? '…'} פתקים בשרת${OFFSET ? ` (+${OFFSET} בתצוגה)` : ''}` : 'מקומי (בלי שרת)';
    backLive.hidden = !(sim && live);
    boxBtn.disabled = voted && !sim;
  }
  backLive.addEventListener('click', () => { stopAuto(); sim = false; setTarget((liveCount || 0) + OFFSET); syncMode(); });
  document.getElementById('addOne').addEventListener('click', () => { if (!sim) sim = true; syncMode(); castVote(); });
  boxBtn.addEventListener('click', castVote);
  const windRange = document.getElementById('windRange'), windOut = document.getElementById('windOut');
  windRange.addEventListener('input', () => { WIND = +windRange.value; windOut.textContent = String(+WIND.toFixed(2)); });

  // the whole process: notes arrive slowly, then faster and faster (simulation only)
  let auto = null;
  const playBtn = document.getElementById('play');
  function stopAuto() { if (auto) { clearTimeout(auto); auto = null; playBtn.textContent = '▶ כל התהליך'; } }
  playBtn.addEventListener('click', () => {
    if (auto) return stopAuto();
    papers.length = 0; simTo(0);
    let k = 0;
    playBtn.textContent = '■ עצירה';
    const step = () => {
      if (target >= GOAL) return stopAuto();
      const interval = Math.max(40, 1400 * Math.pow(0.91, k));
      if (interval > 320) papers.push({ t0: performance.now() });
      else setTarget(Math.min(GOAL, target + 1 + Math.max(0, Math.floor((k - 40) / 9))));
      k++;
      auto = setTimeout(step, interval);
    };
    step();
  });

  const collapseBtn = document.getElementById('collapse');
  const togglePanel = force => {
    const c = panel.classList.toggle('collapsed', force);
    collapseBtn.textContent = c ? 'פתיחה' : 'הסתרה (H)';
  };
  if (matchMedia('(max-width: 600px), (max-height: 500px)').matches) togglePanel(true);
  collapseBtn.addEventListener('click', () => togglePanel());
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('select, input')) return;
    if (e.key === 'h' || e.key === 'H' || e.key === 'י') togglePanel();
    if (e.key === 'Escape') closeCombos();
  });

  // ---------- fonts from the Adobe Fonts kit ----------
  const KIT_URL = 'https://use.typekit.net/nsr0kgo.css';
  const WEIGHTS = { 100: 'Thin', 200: 'ExtraLight', 300: 'Light', 400: 'Regular', 500: 'Medium', 600: 'SemiBold', 700: 'Bold', 800: 'ExtraBold', 900: 'Black' };
  const ROLE_W = { display: 700, num: 400, label: 400 };
  let faces = [];
  const roleSel = { display: document.getElementById('displaySel'), num: document.getElementById('numSel'), label: document.getElementById('labelSel') };
  const roleOk = { display: document.getElementById('displayOk'), num: document.getElementById('numOk'), label: document.getElementById('labelOk') };

  function parseWeight(w) {
    const nums = String(w).match(/\d+/g);
    if (!nums) return /bold/.test(w) ? [700, 700] : [400, 400];
    return [+nums[0], +(nums[1] || nums[0])];
  }
  function kitReady() {
    return new Promise(res => {
      const l = document.getElementById('kit');
      if (l.sheet) return res(true);
      l.addEventListener('load', () => res(true)); l.addEventListener('error', () => res(false));
      setTimeout(() => res(null), 7000);
    });
  }
  async function readKit() {
    const map = new Map();
    const add = (family, weight, style, stretch) => {
      family = String(family || '').replace(/["']/g, '').trim(); if (!family) return;
      const [w0, w1] = parseWeight(weight || 400);
      const fc = { family, w0, w1, style: String(style || 'normal').trim(), stretch: (String(stretch || 'normal').trim().replace(/^100%$/, 'normal')) };
      map.set(`${fc.family}|${w0}|${w1}|${fc.style}|${fc.stretch}`, fc);
    };
    await kitReady();
    try {
      const css = await (await fetch(KIT_URL)).text();
      for (const m of css.matchAll(/@font-face\s*{([^}]*)}/g)) {
        const b = m[1], get = k => (b.match(new RegExp(k + '\\s*:\\s*([^;]+)')) || [])[1];
        add(get('font-family'), get('font-weight'), get('font-style'), get('font-stretch'));
      }
    } catch (e) { /* no CORS on the kit css: the font set below still lists it */ }
    try { document.fonts.forEach(fc => add(fc.family, fc.weight, fc.style, fc.stretch)); } catch (e) {}
    return [...map.values()].sort((a, b) => a.family.localeCompare(b.family) || a.w0 - b.w0);
  }
  const variable = fc => fc.w0 !== fc.w1;
  const faceLabel = fc => `${fc.family} · ${variable(fc) ? `Variable ${fc.w0}–${fc.w1}` : (WEIGHTS[fc.w0] || fc.w0)}${fc.stretch !== 'normal' ? ' · ' + fc.stretch : ''}${fc.style !== 'normal' ? ' · ' + fc.style : ''}`;
  const weightFor = (fc, role) => variable(fc) ? clamp(ROLE_W[role], fc.w0, fc.w1) : fc.w0;

  function applyFont(role, fc, el = root) {
    el.style.setProperty(`--${role}-family`, `"${fc.family}"`);
    el.style.setProperty(`--${role}-weight`, weightFor(fc, role));
    el.style.setProperty(`--${role}-stretch`, fc.stretch);
    el.style.setProperty(`--${role}-style`, fc.style);
  }
  async function checkLoaded(role, fc) {
    const spec = `${fc.style !== 'normal' ? fc.style + ' ' : ''}${weightFor(fc, role)} 40px "${fc.family}"`;
    try { await document.fonts.load(spec, 'אבג123'); } catch (e) {}
    const ok = document.fonts.check(spec, 'אבג123');
    roleOk[role].textContent = ok ? '✓ נטען' : '✗ לא נטען';
    roleOk[role].className = ok ? '' : 'bad';
  }
  // Only a pick made in the panel is remembered; saving the default on every load pinned stale defaults for every visitor.
  // v2 drops the choices that the old code saved that way.
  const FONT_KEY = 'kalpi-font-v2-';
  function choose(role, idx, remember) {
    const fc = faces[idx]; if (!fc) return;
    applyFont(role, fc); roleSel[role].value = idx;
    checkLoaded(role, fc).then(layout);
    if (remember) try { localStorage.setItem(FONT_KEY + role, faceLabel(fc)); } catch (e) {}
  }
  function pickDefault(pattern, targetW, preferWide) {
    let best = -1, score = -1e9;
    faces.forEach((fc, i) => {
      if (fc.style !== 'normal') return;
      let sc = pattern.test(fc.family) ? 1000 : 0;
      if (preferWide && /extend|expand|wide/i.test(fc.family + fc.stretch)) sc += 100;
      sc -= (targetW < fc.w0 ? fc.w0 - targetW : targetW > fc.w1 ? targetW - fc.w1 : 0) / 10;
      if (sc > score) { score = sc; best = i; }
    });
    return best;
  }
  const numVars = document.getElementById('numVars');
  numVars.addEventListener('input', () => root.style.setProperty('--num-vars', numVars.value.trim() || 'normal'));

  async function initFonts() {
    faces = await readKit();
    const note = document.getElementById('kitNote');
    if (!faces.length) {
      note.textContent = 'הפונטים מהקיט לא נטענו. הקיט עובד בכל דומיין ובקובץ מקומי, אז כדאי לפתוח את הקובץ ישירות ב־Chrome ולא בתצוגה מקדימה.';
      Object.values(roleSel).forEach(sel => { sel.innerHTML = '<option>אין פונטים</option>'; sel.disabled = true; });
      return;
    }
    note.textContent = `בקיט: ${new Set(faces.map(fc => fc.family)).size} משפחות, ${faces.length} קבצים. ברירת המחדל לפי ה־Figma.`;
    const opts = faces.map((fc, i) => `<option value="${i}">${faceLabel(fc)}</option>`).join('');
    for (const [role, sel] of Object.entries(roleSel)) { sel.innerHTML = opts; sel.addEventListener('change', () => choose(role, +sel.value, true)); }
    let saved = {};
    try { for (const role of Object.keys(roleSel)) saved[role] = localStorage.getItem(FONT_KEY + role); } catch (e) {}
    const idxOf = lbl => lbl ? faces.findIndex(fc => faceLabel(fc) === lbl) : -1;
    const def = { display: pickDefault(/tel-aviv-brutalist/i, 700), num: pickDefault(/narkiss.?yair/i, 400), label: pickDefault(/narkiss.?yair/i, 400) };
    for (const role of Object.keys(roleSel)) choose(role, idxOf(saved[role]) >= 0 ? idxOf(saved[role]) : def[role]);
  }

  // ---------- combos overlay: display face × counter family ----------
  const combos = document.getElementById('combos'), grid = document.getElementById('combosGrid');
  const boxImg = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(BOX_SVG);
  function buildCombos() {
    grid.innerHTML = '';
    if (!faces.length) { grid.innerHTML = '<p>הפונטים מהקיט לא נטענו.</p>'; return; }
    const fams = new Map();
    faces.forEach((fc, i) => { if (fc.style === 'normal') (fams.get(fc.family + '|' + fc.stretch) || fams.set(fc.family + '|' + fc.stretch, []).get(fc.family + '|' + fc.stretch)).push(i); });
    const groups = [...fams.values()];
    const best = (g, w) => g.reduce((a, b) => { const da = Math.abs(clamp(w, faces[a].w0, faces[a].w1) - w), db = Math.abs(clamp(w, faces[b].w0, faces[b].w1) - w); return db < da ? b : a; });
    const disp = groups.map(g => best(g, 700)), cnt = groups.map(g => [best(g, 400), best(g, 400)]);
    document.getElementById('combosCount').textContent = `${disp.length * cnt.length} שילובים · קליק מחיל`;
    for (const di of disp) for (const [ni, li] of cnt) {
      const card = document.createElement('button');
      card.type = 'button'; card.className = 'card';
      if (+roleSel.display.value === di && +roleSel.num.value === ni && +roleSel.label.value === li) card.classList.add('current');
      card.innerHTML = `<div class="mini"><img alt="" src="${boxImg}"><h2 class="headline">הוסיפו את<br>הפתק שלכם</h2>
        <div class="counter"><b>128</b><span>פתקים הצטרפו לגינה</span></div></div>
        <div class="cap"><span>${faceLabel(faces[di])}</span><span>${faceLabel(faces[ni])}</span></div>`;
      applyFont('display', faces[di], card); applyFont('num', faces[ni], card); applyFont('label', faces[li], card);
      card.addEventListener('click', () => { choose('display', di, true); choose('num', ni, true); choose('label', li, true); closeCombos(); });
      grid.appendChild(card);
    }
    grid.querySelectorAll('.mini').forEach(m => m.style.setProperty('--s', m.clientWidth / 1920));
  }
  function closeCombos() { combos.hidden = true; }
  document.getElementById('openCombos').addEventListener('click', () => { combos.hidden = false; buildCombos(); });
  document.getElementById('closeCombos').addEventListener('click', closeCombos);

  // ---------- the note ----------
  // The note is the paper itself: same size and the same perspective as it goes into the slot
  // (upright, in the slot's plane: skewed 30°), from the first frame to the drop. It follows the mouse
  // and goes into the box only with a click on the box; a click anywhere else shakes it.
  // On touch it waits beside the box: tap it, tap the box, or drag it in.
  // garden words only: no slogans, no party names or words parties campaign on (ביחד, אחדות, אמון, מחר טוב יותר, התחלה חדשה are out)
  const MESSAGES = ['תקווה', 'שלום', 'צמיחה', 'פריחה', 'ניצנים', 'שורשים', 'אור', 'אביב', 'זרעים', 'לגדול'];
  const pickMessage = () => MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
  const NOTE = { w: (SLOT_B.x - SLOT_A.x) * (PAPER_T[1] - PAPER_T[0]), h: PAPER_H, font: 28, skew: 30 };   // frame units
  const FLY_MS = 420;
  const noteEl = document.getElementById('note'), noteMsg = document.getElementById('noteMsg');
  const note = { mode: 'rest', x: -999, y: -999, shake: -1e9, fly: null, drag: null, msg: '' };
  let noteW = 0, noteH = 0, mouse = null;
  const labelFont = () => getComputedStyle(root).getPropertyValue('--label-family').trim() + ', "Arial Hebrew", sans-serif';
  const scr = (x, y) => ({ x: ox + x * sc, y: oy + y * sc });
  const restPt = () => scr(OFF.x - 30, OFF.y + 30);                            // beside the lid's left corner
  const slotPt = () => { const m = lerpPt(SLOT_A, SLOT_B, 0.5); return scr(m.x, m.y - 230 - PAPER_H / 2); };   // where the paper starts its drop
  const overUI = el => !!(el && el.closest && el.closest('.share, .panel, .combos'));

  function sizeNote() {
    noteW = NOTE.w * sc; noteH = NOTE.h * sc;
    Object.assign(noteEl.style, { width: noteW + 'px', height: noteH + 'px', fontSize: NOTE.font * sc + 'px', borderWidth: 2.5 * s + 'px' });
    if (note.mode === 'rest') { const r = restPt(); note.x = r.x; note.y = r.y; }
  }
  function newNote() { note.msg = pickMessage(); noteMsg.textContent = note.msg; note.mode = mouse && !mouse.out ? 'follow' : 'rest'; noteEl.hidden = false; }
  function hideNote() { note.mode = 'gone'; noteEl.hidden = true; root.classList.remove('following'); }
  function throwNote() {
    if (noteEl.hidden || note.mode === 'fly' || note.mode === 'gone') return false;
    note.fly = { t0: performance.now(), x: note.x, y: note.y };
    note.mode = 'fly'; root.classList.remove('following');
    return true;
  }
  function placeNote(now, dt) {
    if (note.mode === 'gone') return;
    let x, y;
    if (note.mode === 'fly') {
      const f = note.fly, t = clamp((now - f.t0) / FLY_MS), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, to = slotPt();
      x = f.x + (to.x - f.x) * e; y = f.y + (to.y - f.y) * e - Math.sin(t * Math.PI) * 60 * s;   // a little arc
      if (t >= 1) {
        papers.push({ t0: now, msg: note.msg, font: labelFont() });
        if (sim || !voted) newNote(); else return hideNote();
        const r = restPt(); note.x = mouse && !mouse.out ? mouse.x : r.x; note.y = mouse && !mouse.out ? mouse.y : r.y;
      }
    } else {
      let tx, ty;
      if (note.mode === 'drag') { tx = note.drag.x + note.drag.dx; ty = note.drag.y + note.drag.dy; }
      else if (note.mode === 'follow') { tx = mouse.x; ty = mouse.y; }
      else { const r = restPt(); tx = r.x; ty = r.y + (reduce ? 0 : Math.sin(now / 500) * 5 * s); }
      const a = reduce || note.mode === 'drag' ? 1 : Math.min(1, dt * 16);
      if (note.x < -900) { note.x = tx; note.y = ty; }   // first frame: no swoop in from the corner
      note.x += (tx - note.x) * a; note.y += (ty - note.y) * a;
      x = note.x; y = note.y;
      const st = (now - note.shake) / 380;                                                            // "only into the box"
      if (st < 1) x += Math.sin(st * 26) * noteW * 0.12 * (1 - st);
    }
    noteEl.style.transform = `translate(${x - noteW / 2}px, ${y - noteH / 2}px) skewY(${NOTE.skew}deg)`;
  }

  // mouse: the note follows; hidden over buttons and panels, where the normal cursor comes back
  const canHover = matchMedia('(any-hover: hover)');   // phones send stray mouse events; only real mice drive the note
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !canHover.matches) return;
    mouse = { x: e.clientX, y: e.clientY, box: e.target === boxBtn, ui: overUI(e.target), out: false };
    if (note.mode === 'rest') note.mode = 'follow';
    noteEl.classList.toggle('off', note.mode === 'follow' && mouse.ui);
    root.classList.toggle('following', note.mode === 'follow' && !mouse.ui);
  });
  root.addEventListener('mouseleave', () => {
    if (mouse) mouse.out = true;
    if (note.mode === 'follow') note.mode = 'rest';
    noteEl.classList.remove('off'); root.classList.remove('following');
  });
  // the box itself is the target: a click counts when the cursor or any part of the note is on the box
  const hullOnScreen = () => HULL.map(p => scr(p.x, p.y));
  function noteOnBox() {
    const hull = hullOnScreen(), dy = noteH / 2, dx = noteW / 2, k = Math.tan(NOTE.skew * Math.PI / 180) * dx;
    return [[0, 0], [0, -dy], [0, dy], [-dx, -dy - k], [dx, -dy + k], [-dx, dy - k], [dx, dy + k]]
      .some(([u, v]) => inPoly({ x: note.x + u, y: note.y + v }, hull));
  }
  addEventListener('click', e => {
    if (note.mode !== 'follow' && note.mode !== 'rest') return;
    if (e.target === boxBtn || overUI(e.target) || noteEl.contains(e.target)) return;   // the box button votes on its own
    if (note.mode === 'follow' && noteOnBox()) castVote();
    else note.shake = performance.now();
  });
  // touch: drag the note into the box, or just tap it
  noteEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || note.mode !== 'rest') return;
    noteEl.setPointerCapture(e.pointerId);
    note.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, dx: note.x - e.clientX, dy: note.y - e.clientY };
    note.mode = 'drag';
  });
  noteEl.addEventListener('pointermove', e => { if (note.drag && e.pointerId === note.drag.id) { note.drag.x = e.clientX; note.drag.y = e.clientY; } });
  const endDrag = (e, cancel) => {
    const d = note.drag; if (!d || e.pointerId !== d.id) return;
    note.drag = null; note.mode = 'rest';
    if (cancel) return;
    const tap = Math.hypot(d.x - d.x0, d.y - d.y0) < 10;
    if (tap || noteOnBox()) castVote();   // dropped with any part of it on the box
  };
  noteEl.addEventListener('pointerup', e => endDrag(e, false));
  noteEl.addEventListener('pointercancel', e => endDrag(e, true));

  // ---------- share ----------
  const shareLabel = document.getElementById('shareLabel'), SHARE_LABEL = shareLabel.textContent;
  const shareUrl = location.origin + location.pathname;   // without ?review
  let shareTimer = 0;
  async function copyLink() {
    try { await navigator.clipboard.writeText(shareUrl); } catch (e) { return; }
    shareLabel.textContent = 'הקישור הועתק';
    clearTimeout(shareTimer); shareTimer = setTimeout(() => { shareLabel.textContent = SHARE_LABEL; }, 2200);
  }
  shareEl.addEventListener('click', async () => {
    shareEl.classList.remove('nudge');
    if (!navigator.share) return copyLink();
    try { await navigator.share({ title: document.title, text: 'הוסיפו את הפתק שלכם', url: shareUrl }); }
    catch (e) { if (e.name !== 'AbortError') copyLink(); }
  });

  // Phones fire resize for toolbars and the keyboard: only a real change of size grows a new garden
  let resizeTimer = 0, booted = false, gardenW = 0, gardenH = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!hasSize()) return;
      if (!booted) return boot();
      layout();
      if (innerWidth === gardenW && Math.abs(innerHeight - gardenH) < gardenH * 0.2) return;
      gardenW = innerWidth; gardenH = innerHeight;
      genGarden(); bloomTo(nGrow, performance.now());
    }, 150);
  });

  // ---------- boot ----------
  // waits for the first real window size (see hasSize)
  function boot() {
    booted = true;
    defineSpecies();
    genSlot();       // before layout(): its heads and leaves are rendered with the rest
    newNote();
    layout();
    gardenW = innerWidth; gardenH = innerHeight;
    genGarden();
    if (LIVE) {
      let last = null;
      try { last = JSON.parse(localStorage.getItem('kalpi-count')); } catch (e) {}
      if (Number.isFinite(last)) { setTarget(last + OFFSET); markKnown(); }
      setTimeout(markKnown, 8000);   // never hide the counter for good
    } else counterEl.classList.remove('waiting');
    showCount();
    syncMode();
    initFonts();
    requestAnimationFrame(frame);
  }
  if (hasSize()) boot();
})();
</script>
<script type="module" src="live.js"></script>
</body>
