<style>
/* Composition = the Figma frame (1920×1080). Everything scales by --s; UI anchors to the viewport edges with 64-unit padding. */
:root {
  --s: 1;
  --blue: #1c7de4;
  --lawn-deep: #2f9443;
  --ink: #101010;
  --paper: #ffffff;
  --count-color: var(--blue);
  /* roles (overwritten from the kit at runtime) */
  --display-family: "levit-1950"; --display-weight: 900; --display-stretch: normal; --display-style: normal;
  --num-family: "narkiss-yair-variable"; --num-weight: 700; --num-stretch: normal; --num-style: normal; --num-vars: "MONO" 1;
  --label-family: "narkiss-yair-variable"; --label-weight: 400; --label-stretch: normal; --label-style: normal;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--blue); }
body { font-family: system-ui, "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- composition text (positions from Figma) ---------- */
.frame-ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.headline {
  position: absolute; margin: 0;
  top: calc(64px * var(--s) + env(safe-area-inset-top, 0px)); right: calc(64px * var(--s) + env(safe-area-inset-right, 0px));
  width: calc(696.035px * var(--s));
  font-family: var(--display-family), "levit-1950", "Levit 1950", "Levit_1950", "Arial Black", "Arial Hebrew", sans-serif;
  font-weight: var(--display-weight); font-stretch: var(--display-stretch); font-style: var(--display-style);
  font-size: calc(124.83px * var(--s)); line-height: .8;
  color: var(--paper); text-align: right; direction: rtl; word-break: break-word;
  -webkit-text-stroke: calc(5px * var(--s)) var(--ink); paint-order: stroke fill; /* 2.5 outside stroke */
  text-box: trim-both cap alphabetic;
}
.counter {
  position: absolute;
  left: calc(64px * var(--s) + env(safe-area-inset-left, 0px)); bottom: calc(64px * var(--s) + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border: calc(2.5px * var(--s)) solid #000;
  padding: calc(16px * var(--s));
  display: flex; flex-direction: column; align-items: center; gap: calc(33px * var(--s));
  color: var(--count-color); line-height: .8; white-space: nowrap;
  transition: color .6s, opacity .4s;
}
.counter.waiting { opacity: 0; }   /* until the real count arrives */
.counter b {
  font-family: var(--num-family), "narkiss-yair-variable", "narkiss-yair", "Narkiss Yair Variable", "Arial Hebrew", sans-serif;
  font-weight: var(--num-weight); font-stretch: var(--num-stretch); font-style: var(--num-style);
  font-variation-settings: var(--num-vars);
  font-size: calc(120.401px * var(--s)); font-variant-numeric: tabular-nums slashed-zero;
  text-box: trim-both cap alphabetic;
}
.counter span {
  font-family: var(--label-family), "narkiss-yair-variable", "narkiss-yair", "Narkiss Yair Variable", "Arial Hebrew", sans-serif;
  font-weight: var(--label-weight); font-stretch: var(--label-stretch); font-style: var(--label-style);
  font-size: calc(32px * var(--s)); text-align: right; direction: rtl;
  text-box: trim-both cap alphabetic;
}

/* share: the counter's paper box with the box's solid shadow (direction V). Wide: top-left, level with the headline;
   portrait: no room beside the headline, so it sits in the bottom row with the counter. */
.share {
  position: absolute; pointer-events: auto; margin: 0;
  left: calc(64px * var(--s) + env(safe-area-inset-left, 0px)); top: calc(64px * var(--s) + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: calc(22px * var(--s));
  padding: calc(22px * var(--s)) calc(26px * var(--s));
  background: var(--paper); color: var(--ink); border: calc(2.5px * var(--s)) solid var(--ink);
  box-shadow: calc(13.3px * var(--s)) calc(5.9px * var(--s)) 0 var(--ink);
  font-family: var(--num-family), "narkiss-yair-variable", "narkiss-yair", "Narkiss Yair Variable", "Arial Hebrew", sans-serif;
  font-weight: var(--num-weight); font-stretch: var(--num-stretch); font-style: var(--num-style);
  font-size: calc(40px * var(--s)); line-height: .8; white-space: nowrap; direction: rtl;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .12s, box-shadow .12s;
}
.share span { text-box: trim-both cap alphabetic; }
.share svg { width: calc(64px * var(--s)); height: calc(26px * var(--s)); flex: none; overflow: visible;
  fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .share:hover { transform: translate(calc(-2px * var(--s)), calc(-1px * var(--s))); box-shadow: calc(15.3px * var(--s)) calc(6.9px * var(--s)) 0 var(--ink); } }
.share:active { transform: translate(calc(13.3px * var(--s)), calc(5.9px * var(--s))); box-shadow: 0 0 0 var(--ink); }
.share:focus-visible { outline: 3px dashed var(--paper); outline-offset: 6px; }
.share.nudge svg { animation: nudge .55s ease-in-out 3; }
@keyframes nudge { 50% { transform: translateX(calc(-12px * var(--s))); } }
.portrait .share { left: auto; top: auto; right: calc(64px * var(--s) + env(safe-area-inset-right, 0px)); bottom: calc(64px * var(--s) + env(safe-area-inset-bottom, 0px)); }
@media (pointer: coarse) { .share { min-height: 44px; box-sizing: border-box; } }

/* the note: follows the mouse and goes into the box only with a click on the box.
   On touch it waits by the box: tap it, tap the box, or drag it in. Sized from JS in layout(). */
.note {
  position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; box-sizing: border-box;
  display: grid; place-items: center; padding: .3em; text-align: center; direction: rtl;
  background: var(--paper); color: var(--ink); border: solid var(--ink);
  font-family: var(--label-family), "narkiss-yair-variable", "narkiss-yair", "Narkiss Yair Variable", "Arial Hebrew", sans-serif;
  font-weight: 700; line-height: 1.05; overflow-wrap: break-word;
  will-change: transform; transition: opacity .15s;
}
.note span { width: 100%; }
.note[hidden] { display: none; }
.note.off { opacity: 0; }
@media (hover: none) { .note { pointer-events: auto; touch-action: none; } }
.following, .following #boxBtn { cursor: none; }
@media (prefers-reduced-motion: reduce) { .share, .share svg { transition: none; animation: none !important; } }

#boxBtn { position: fixed; z-index: 3; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#boxBtn:focus-visible { outline: 3px dashed var(--paper); outline-offset: 6px; }

/* Figma: Texturelabs paper, screen blend, over everything */
.grain {
  position: fixed; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: screen;
  background: url(paper.jpg) center / cover no-repeat;
}

/* ---------- review panel (not part of the design) ---------- */
.panel {
  position: fixed; z-index: 10; top: 16px; left: 16px; width: 296px; max-height: calc(100% - 300px); min-height: 200px; overflow: auto;
  background: #fff; color: var(--ink); border: 2px solid var(--ink);
  font: 13px/1.4 system-ui, "Segoe UI", Arial, sans-serif; direction: rtl;
  box-shadow: 6px 6px 0 var(--ink);
}
.panel header {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 12px; border-bottom: 2px solid var(--ink); font-weight: 700;
  position: sticky; top: 0; background: #fff;
}
.panel header button { font: inherit; font-weight: 400; background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; color: inherit; }
.panel.collapsed { width: auto; min-height: 0; }
.panel.collapsed .body { display: none; }
.panel.collapsed header { border-bottom: 0; }
.panel .body { padding: 10px 12px 12px; display: grid; gap: 14px; }
.panel h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; color: #555; font-weight: 600; }
.states { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 12px; padding: 5px 8px; cursor: pointer;
  background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 0;
}
.chip:hover { background: #eef4fd; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip.primary { background: var(--blue); color: #fff; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row input[type=range] { flex: 1; accent-color: var(--ink); }
.row output { min-width: 3.2em; text-align: left; font-variant-numeric: tabular-nums; font-weight: 600; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: #444; display: flex; justify-content: space-between; gap: 6px; }
.field label i { font-style: normal; color: #2f9443; }
.field label i.bad { color: #c62828; }
.field select, .field input[type=text] { font: inherit; padding: 4px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); max-width: 100%; }
.field input[type=text] { direction: ltr; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.note { font-size: 11.5px; color: #555; margin: 0; }
.chip:focus-visible, .panel select:focus-visible, .panel input:focus-visible, .panel header button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- font combos overlay ---------- */
.combos {
  position: fixed; inset: 0; z-index: 20; background: #f1efe9; overflow: auto; direction: rtl;
  font: 13px/1.4 system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink);
}
.combos-head {
  position: sticky; top: 0; z-index: 1; background: #f1efe9; border-bottom: 2px solid var(--ink);
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 24px;
}
.combos-head strong { font-size: 15px; }
.combos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 24px; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
@media (max-width: 600px), (max-height: 500px) {
  .panel { top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 58%; min-height: 0; box-shadow: 4px 4px 0 var(--ink); }
  .panel.collapsed { left: auto; right: 8px; }
  .combos-head { padding: 12px 16px; }
}
.card { display: grid; gap: 8px; cursor: pointer; background: none; border: 0; padding: 0; text-align: right; font: inherit; color: inherit; }
.card .mini .headline { top: calc(64px * var(--s)); right: calc(64px * var(--s)); }
.card .mini .counter { left: calc(64px * var(--s)); bottom: calc(64px * var(--s)); }
.card .mini { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--blue); border: 2px solid var(--ink); }
.card .mini img { position: absolute; display: block; max-width: none;
  left: calc(516.83px * var(--s)); top: calc(180.6px * var(--s)); width: calc(1116px * var(--s)); height: calc(854px * var(--s)); }
.card:hover .mini, .card:focus-visible .mini { outline: 4px solid var(--blue); outline-offset: 2px; }
.card .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.card .cap span:first-child { font-weight: 600; }
.card.current .mini { outline: 4px solid var(--ink); outline-offset: 2px; }
</style>

<body>

<canvas id="scene" aria-hidden="true"></canvas>

<main class="frame-ui">
  <h1 class="headline">הוסיפו את הפתק שלכם</h1>
  <div class="counter waiting" aria-live="polite"><b id="num">0</b><span>פתקים הצטרפו לגינה</span></div>
  <button class="share" id="share" type="button"><span id="shareLabel" aria-live="polite">שתפו את הקלפי</span><svg viewBox="0 0 64 26" aria-hidden="true"><path d="M62 13H3M14 2 3 13l11 11"/></svg></button>
</main>

<button id="boxBtn" type="button" aria-label="הכניסו פתק לקלפי"></button>
<div class="note" id="note" aria-hidden="true"><span id="noteMsg"></span></div>

<aside class="panel" id="panel">
  <header>

  </header>
  <div class="body">
    <section>
      <h3>מצב</h3>
      <div class="row"><span id="mode">…</span><button class="chip" type="button" id="backLive" hidden>חזרה לחי</button></div>

    <section>
      <h3>מצבים</h3>
      <div class="states" id="states"></div>
    </section>
    <section>
      <h3>פתקים</h3>
      <div class="row">
        <input id="nRange" type="range" min="0" max="1000" step="1" value="0" aria-label="מספר פתקים">
        <output id="nOut">0</output>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="chip" type="button" id="addOne">+ פתק (או קליק על הקלפי)</button>
        <button class="chip primary" type="button" id="play">▶ כל התהליך</button>
      </div>
    </section>
    <section>
      <h3>רוח</h3>
      <div class="row">
        <input id="windRange" type="range" min="0" max="2" step="0.05" value="1" aria-label="עוצמת רוח">
        <output id="windOut">1</output>

    <section>
      <h3>פונטים</h3>
      <div class="field"><label for="displaySel">כותרת <i id="displayOk"></i></label><select id="displaySel"></select></div>
      <div class="field" style="margin-top:8px"><label for="numSel">מספר <i id="numOk"></i></label><select id="numSel"></select></div>
      <div class="field" style="margin-top:8px"><label for="labelSel">טקסט המונה <i id="labelOk"></i></label><select id="labelSel"></select></div>
      <div class="field" style="margin-top:8px"><label for="numVars">צירים למספר (Mono)</label><input id="numVars" type="text" value='"MONO" 1' spellcheck="false"></div>
      <div class="row" style="margin-top:8px"><button class="chip" type="button" id="openCombos">השוואת שילובים</button></div>
      <p class="note" id="kitNote">טוען את הפונטים מהקיט…</p>
    </section>
  </div>
</aside>

<div class="combos" id="combos" hidden>
  <div class="combos-head">
    <strong>שילובי פונטים: כותרת × מונה</strong>
    <span id="combosCount"></span>
    <button class="chip" type="button" id="closeCombos">סגירה (Esc)</button>
  </div>
  <div class="combos-grid" id="combosGrid"></div>
</div>

<script>
(() => {
  // ---------- tokens ----------
  const INK = '#101010', BLUE = '#1c7de4', WHITE = '#ffffff';
  const LAWN = '#93dd6f', GRASS = '#4cb54f', GRASS_DK = '#2f9443', BUSH = '#3e9f4c', TREE = '#5bbd52';
  const RED = '#ff4b3e', YEL = '#ffcf3a', PINK = '#ff9ac1', ORANGE = '#ff8a2b', TAN = '#f1d27a';
  const ISO = 0.5774, TAU = Math.PI * 2;
  const CONFIG = window.KALPI_CONFIG || {};
  const GOAL = Math.max(100, CONFIG.goal || 1000);   // notes until the whole ground is green
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let WIND = 1;

  // ---------- the ballot box, exported from Figma (node 27:882) ----------
  const OFF = { x: 516.83, y: 180.60 };   // SVG export origin inside the 1920×1080 frame
  const BOX_SVG = `<svg width="1116" height="854" viewBox="0 0 1116 854" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M473.617 499.546L473.701 499.628L473.817 499.639L659.134 516.608L1114.74 712.005L864.218 853.113L415.216 655.674L15.6372 424.97L254.968 286.78L473.617 499.546Z" fill="#101010" stroke="#101010" stroke-width="0.66"/>
<path d="M14.978 424.97L415.07 655.97V477.77L14.978 246.77V424.97Z" fill="white" stroke="#101010" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M655.112 517.37L415.07 655.97V477.77L655.112 339.17V517.37Z" fill="#101010" stroke="#101010" stroke-width="1.584" stroke-linejoin="round"/>
<path d="M14.978 246.77L415.07 477.77V488.66L23.36 262.544L14.978 252.776V246.77Z" fill="#101010"/>
<path d="M1.25 246.77L415.07 485.69V386.69L1.25 147.77V246.77Z" fill="white" stroke="#101010" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M668.84 339.17L415.07 485.69V386.69L668.84 240.17V339.17Z" fill="#101010" stroke="#101010" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M255.02 1.25L668.84 240.17L415.07 386.69L1.25 147.77L255.02 1.25Z" fill="white" stroke="#101010" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M253.304 142.16L424.772 241.16L416.786 245.78L245.318 146.78L253.304 142.16Z" fill="#101010"/>
</svg>`;
  const BOX_PARTS = [...BOX_SVG.matchAll(/<path d="([^"]+)" fill="([^"]+)"(?: stroke="([^"]+)" stroke-width="([^"]+)")?/g)]
    .map(m => ({ p: new Path2D(m[1]), fill: m[2] === 'white' ? WHITE : m[2], stroke: m[3], sw: m[4] ? +m[4] : 0 }));
  const SHADOW_PART = BOX_PARTS[0], BODY_PARTS = BOX_PARTS.slice(1);

  const f = (x, y) => ({ x: x + OFF.x, y: y + OFF.y });
  const A = f(14.978, 424.97), B = f(415.07, 655.97), C = f(655.112, 517.37), D = f(255.02, 286.37);
  const CENTER = f(335.04, 471.17);
  const H_LID = 269.28;
  const SLOT_A = f(249.311, 144.47), SLOT_B = f(420.779, 243.47);
  const V = { x: 1.662, y: 0.742 };   // shadow offset per unit of height, read off the Figma shadow
  const SHADOW_POLY = [[473.6, 499.5], [659.1, 516.6], [1114.7, 712.0], [864.2, 853.1], [415.2, 655.7], [15.6, 425.0], [255.0, 286.8]].map(([x, y]) => f(x, y));
  const HULL = [[1.25, 147.77], [255.02, 1.25], [668.84, 240.17], [668.84, 339.17], [655.11, 517.37], [415.07, 655.97], [14.98, 424.97], [1.25, 246.77]].map(([x, y]) => f(x, y));
  const FOOT = [A, B, C, D].map(p => ({ x: CENTER.x + (p.x - CENTER.x) * 1.12, y: CENTER.y + (p.y - CENTER.y) * 1.12 }));

  // ---------- helpers ----------
  function mulberry(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const elastic = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.cos(t * Math.PI * 2.6) * Math.exp(-t * 5.5);
  const lerpPt = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
  const isoDist = (x, y, c) => Math.hypot(x - c.x, (y - c.y) / ISO);
  function inPoly(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  }
  function inFront(x, y) {
    if (x < A.x - 60 || x > C.x + 80) return false;
    const fy = x < B.x ? A.y + (B.y - A.y) * (x - A.x) / (B.x - A.x) : B.y + (C.y - B.y) * (x - B.x) / (C.x - B.x);
    return y > fy;
  }

  // ---------- canvas / layout ----------
  const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
  const root = document.documentElement, boxBtn = document.getElementById('boxBtn');
  const headEl = document.querySelector('.headline'), counterEl = document.querySelector('.counter'), shareEl = document.getElementById('share');
  // s scales the text (Figma units); sc = s · SCENE_K scales the box and the garden, which read too big at the frame's size
  const SCENE_K = { wide: 0.72, portrait: 0.72 };
  const HULL_C = { x: OFF.x + 335, y: OFF.y + 328 };   // middle of the box outline: the scene shrinks around it
  let W = 0, H = 0, DPR = 1, s = 1, sc = 1, ox = 0, oy = 0, BASE = [1, 0, 0, 1, 0, 0], view = { x0: 0, y0: 0, x1: 1920, y1: 1080 };
  let PORTRAIT = false, PLANT_K = 1;   // phones: plants drawn a bit larger so they still read
  let LINE_K = 1;                      // the box keeps the Figma 2.5 stroke at any scene scale, like the text UI
  let counterPt = { x: 200, y: 950 };

  function layout() {
    W = innerWidth; H = innerHeight;
    DPR = Math.min(2, devicePixelRatio || 1);
    PORTRAIT = W / H < 0.9;
    s = PORTRAIT ? Math.min(W / 930, H / 1700) : Math.min(W / 1920, H / 1080);
    sc = s * (PORTRAIT ? SCENE_K.portrait : SCENE_K.wide);
    LINE_K = s / sc;
    root.style.setProperty('--s', s);
    root.classList.toggle('portrait', PORTRAIT);
    if (PORTRAIT) {
      // phone / portrait: the box is centred on the screen, as long as the bouquet clears the headline
      // and the box clears the bottom row (counter, share). Measured from the page, so the real fonts count.
      const top = headEl.getBoundingClientRect().bottom;
      const bottom = Math.min(counterEl.getBoundingClientRect().top, shareEl.getBoundingClientRect().top);
      const bouquet = 330 * sc, below = 700 * sc;       // above the lid top / lid top to box bottom
      const centred = H / 2 - (HULL_C.y - OFF.y - 1.25) * sc;
      const lidTop = Math.max(top + bouquet + 8, Math.min(bottom - below, centred));
      ox = W / 2 - HULL_C.x * sc;
      oy = lidTop - (OFF.y + 1.25) * sc;
    } else {
      // the frame is centred; the box keeps its middle where Figma has it
      ox = (W - 1920 * s) / 2 + HULL_C.x * (s - sc);
      oy = (H - 1080 * s) / 2 + HULL_C.y * (s - sc);
    }
    PLANT_K = PORTRAIT ? 1.15 : 1;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    sizeLayers();
    BASE = [DPR * sc, 0, 0, DPR * sc, DPR * ox, DPR * oy];
    view = { x0: -ox / sc, y0: -oy / sc, x1: (W - ox) / sc, y1: (H - oy) / sc };
    const xs = HULL.map(p => ox + p.x * sc), ys = HULL.map(p => oy + p.y * sc);
    Object.assign(boxBtn.style, { left: Math.min(...xs) + 'px', top: Math.min(...ys) + 'px', width: (Math.max(...xs) - Math.min(...xs)) + 'px', height: (Math.max(...ys) - Math.min(...ys)) + 'px' });
    const r = counterEl.getBoundingClientRect();
    counterPt = { x: (r.left + r.width / 2 - ox) / sc, y: (r.top + r.height / 2 - oy) / sc };
    buildSprites();
    sizeNote();
    dirty = true;
  }

  // ---------- vector drawing (local units = Figma px, base at 0,0, up is −y) ----------
  function paint(g, fill, sh, lw) {
    g.fillStyle = sh ? INK : fill; g.fill();
    if (lw) { g.lineWidth = lw; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
  }
  function flat(g, x, y, build) { g.save(); g.translate(x, y); g.scale(1, ISO); g.beginPath(); build(); g.restore(); }
  const quadPt = (p0, p1, p2, t) => ({ x: (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x, y: (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y });
  function leafShape(g, x, y, L, ang, col, sh, lw) {
    g.save(); g.translate(x, y); g.rotate(ang);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(L * 0.5, -L * 0.36, L, 0); g.quadraticCurveTo(L * 0.5, L * 0.2, 0, 0);
    g.restore(); paint(g, col, sh, lw);
  }
  function blob(g, circles, col, sh, lw) {   // union of circles with a single outline
    if (lw) { g.beginPath(); circles.forEach(([x, y, r]) => { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }); g.lineWidth = lw * 2; g.strokeStyle = INK; g.stroke(); }
    g.beginPath(); circles.forEach(([x, y, r]) => { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }); g.fillStyle = sh ? INK : col; g.fill();
  }

  // ---------- species: each variant = stem/body sprite (+ optional head sprite) ----------
  const SPECIES = {};
  function stemDraw(h, lean, leaves, lw) {
    const p0 = { x: 0, y: 0 }, p1 = { x: lean * 0.15, y: -h * 0.55 }, p2 = { x: lean, y: -h };
    return (g, sh) => {
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
      g.lineWidth = lw; g.strokeStyle = INK; g.lineCap = 'round'; g.stroke();
      for (const lf of leaves) { const q = quadPt(p0, p1, p2, lf.t); leafShape(g, q.x, q.y, lf.L, lf.side > 0 ? -0.55 : Math.PI + 0.55, lf.col || GRASS, sh, 1.7); }
    };
  }
  const stemBounds = (h, lean, L) => ({ x0: Math.min(0, lean) - L - 6, x1: Math.max(0, lean) + L + 6, y0: -h - 6, y1: 6 });

  function flatHead(type, R, col) {
    const petals = [];
    if (type === 'daisy') for (let i = 0; i < 12; i++) petals.push({ a: i / 12 * TAU, d: 0.55, rx: 0.45, ry: 0.16 });
    if (type === 'anemone') for (let i = 0; i < 6; i++) petals.push({ a: i / 6 * TAU + 0.3, d: 0.45, rx: 0.42, ry: 0.42 });
    if (type === 'five') for (let i = 0; i < 5; i++) petals.push({ a: i / 5 * TAU - 0.4, d: 0.48, rx: 0.38, ry: 0.3 });
    petals.sort((m, n) => Math.sin(m.a) - Math.sin(n.a));
    const center = type === 'daisy' ? [0.28, YEL] : type === 'anemone' ? [0.27, INK] : [0.19, WHITE];
    return {
      draw: (g, sh) => {
        for (const q of petals) { flat(g, 0, 0, () => g.ellipse(Math.cos(q.a) * R * q.d, Math.sin(q.a) * R * q.d, R * q.rx, R * q.ry, q.a, 0, TAU)); paint(g, col, sh, 2); }
        flat(g, 0, 0, () => g.arc(0, 0, R * center[0], 0, TAU)); paint(g, center[1], sh, 2);
      },
      bounds: { x0: -R * 1.05, x1: R * 1.05, y0: -R * 0.65, y1: R * 0.65 },
    };
  }
  function tulipHead(R, col) {
    const w = R * 0.56;
    return {
      draw: (g, sh) => {
        g.beginPath(); g.moveTo(-w, -R * 0.75);
        g.quadraticCurveTo(-w, 0, 0, 0); g.quadraticCurveTo(w, 0, w, -R * 0.75);
        g.lineTo(w * 0.5, -R * 1.25); g.lineTo(0, -R * 0.85); g.lineTo(-w * 0.5, -R * 1.25); g.closePath();
        paint(g, col, sh, 2);
      },
      bounds: { x0: -w - 3, x1: w + 3, y0: -R * 1.3 - 3, y1: 3 },
    };
  }
  function sunHead(R) {
    return {
      draw: (g, sh) => {
        for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; g.beginPath(); g.ellipse(Math.cos(a) * R * 0.62, -R * 0.9 + Math.sin(a) * R * 0.62, R * 0.38, R * 0.15, a, 0, TAU); paint(g, YEL, sh, 2); }
        g.beginPath(); g.arc(0, -R * 0.9, R * 0.42, 0, TAU); paint(g, INK, sh, 2);
        if (!sh) { g.fillStyle = YEL; for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; g.beginPath(); g.arc(Math.cos(a) * R * 0.22, -R * 0.9 + Math.sin(a) * R * 0.22, R * 0.05, 0, TAU); g.fill(); } }
      },
      bounds: { x0: -R * 1.1, x1: R * 1.1, y0: -R * 2, y1: R * 0.2 },
    };
  }
  function puffHead(R) {
    return {
      draw: (g, sh) => {
        g.beginPath(); g.arc(0, -R * 0.9, R, 0, TAU); paint(g, WHITE, sh, 1.6);
        if (!sh) {
          g.strokeStyle = INK; g.lineWidth = 1.2;
          for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; g.beginPath(); g.moveTo(Math.cos(a) * R * 0.2, -R * 0.9 + Math.sin(a) * R * 0.2); g.lineTo(Math.cos(a) * R * 0.75, -R * 0.9 + Math.sin(a) * R * 0.75); g.stroke(); }
        }
      },
      bounds: { x0: -R - 3, x1: R + 3, y0: -R * 1.9 - 3, y1: 3 },
    };
  }
  function spikeHead(L, col) {
    return {
      draw: (g, sh) => {
        const n = 7;
        for (let i = 0; i < n; i++) { const t = i / (n - 1), y = -t * L, side = i % 2 ? 1 : -1, r = 5.5 * (1 - t * 0.45); g.beginPath(); g.ellipse(side * 3.2, y, r, r * 0.8, side * 0.5, 0, TAU); paint(g, col, sh, 1.6); }
      },
      bounds: { x0: -12, x1: 12, y0: -L - 9, y1: 7 },
    };
  }

  function addSpecies(name, n, make) { SPECIES[name] = []; const r = mulberry(name.length * 7919 + n); for (let i = 0; i < n; i++) SPECIES[name].push(make(r, i)); }

  function defineSpecies() {
    addSpecies('grass', 10, r => {
      const nb = 3 + Math.floor(r() * 4), col = r() < 0.6 ? GRASS : GRASS_DK, blades = [];
      for (let k = 0; k < nb; k++) blades.push({ x: (k - (nb - 1) / 2) * 4 + (r() - 0.5) * 3, h: 12 + r() * 24, lean: (k - (nb - 1) / 2) * 3.5 + (r() - 0.5) * 6, w: 4 + r() * 2.5 });
      return { flex: 1.1, body: { bounds: { x0: -32, x1: 32, y0: -44, y1: 4 }, draw: (g, sh) => {
        for (const b of blades) { g.beginPath(); g.moveTo(b.x - b.w / 2, 0); g.quadraticCurveTo(b.x - b.w / 2 + b.lean * 0.2, -b.h * 0.6, b.x + b.lean, -b.h); g.quadraticCurveTo(b.x + b.w / 2 + b.lean * 0.2, -b.h * 0.5, b.x + b.w / 2, 0); g.closePath(); paint(g, col, sh, 1.8); }
      } } };
    });
    addSpecies('reed', 4, r => {
      const blades = [0, 1, 2].map(k => ({ x: (k - 1) * 5, h: 38 + r() * 34, lean: (k - 1) * 7 + (r() - 0.5) * 8 }));
      const stalk = { h: 60 + r() * 22, lean: (r() - 0.5) * 12 };
      return { flex: 1.3, body: { bounds: { x0: -34, x1: 34, y0: -96, y1: 4 }, draw: (g, sh) => {
        for (const b of blades) { g.beginPath(); g.moveTo(b.x - 2.5, 0); g.quadraticCurveTo(b.x + b.lean * 0.2, -b.h * 0.6, b.x + b.lean, -b.h); g.quadraticCurveTo(b.x + 2.5 + b.lean * 0.2, -b.h * 0.5, b.x + 2.5, 0); g.closePath(); paint(g, GRASS_DK, sh, 1.6); }
        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(stalk.lean * 0.2, -stalk.h * 0.6, stalk.lean, -stalk.h); g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke();
        g.beginPath(); g.ellipse(stalk.lean, -stalk.h - 7, 3.6, 9, stalk.lean * 0.01, 0, TAU); paint(g, TAN, sh, 1.6);
      } } };
    });
    addSpecies('clover', 4, r => {
      const sprigs = []; const n = 3 + Math.floor(r() * 3);
      for (let k = 0; k < n; k++) sprigs.push({ x: (r() - 0.5) * 22, h: 7 + r() * 10 });
      const flower = r() < 0.45;
      return { flex: 0.5, body: { bounds: { x0: -26, x1: 26, y0: -32, y1: 6 }, draw: (g, sh) => {
        for (const sp of sprigs) {
          g.beginPath(); g.moveTo(sp.x, 0); g.lineTo(sp.x, -sp.h); g.lineWidth = 1.5; g.strokeStyle = INK; g.stroke();
          for (let i = 0; i < 3; i++) { const a = i / 3 * TAU - Math.PI / 2; flat(g, sp.x, -sp.h, () => g.arc(Math.cos(a) * 4.2, Math.sin(a) * 4.2, 4.4, 0, TAU)); paint(g, GRASS, sh, 1.5); }
        }
        if (flower) { const sp = sprigs[0]; g.beginPath(); g.moveTo(sp.x + 2, 0); g.lineTo(sp.x + 3, -sp.h - 9); g.lineWidth = 1.5; g.stroke(); g.beginPath(); g.arc(sp.x + 3, -sp.h - 12, 4.5, 0, TAU); paint(g, WHITE, sh, 1.5); }
      } } };
    });
    addSpecies('bush', 6, r => {
      const Wd = 40 + r() * 34, Hh = 30 + r() * 26;
      const circles = [[-Wd * 0.28, -Hh * 0.4, Wd * 0.3], [Wd * 0.28, -Hh * 0.38, Wd * 0.3], [0, -Hh * 0.62, Wd * 0.33], [-Wd * 0.06, -Hh * 0.3, Wd * 0.3]];
      const dots = []; const dc = [WHITE, PINK, YEL][Math.floor(r() * 3)];
      if (r() < 0.65) for (let i = 0; i < 5; i++) dots.push([(r() - 0.5) * Wd * 0.8, -Hh * (0.3 + r() * 0.5)]);
      return { flex: 0.12, body: { bounds: { x0: -Wd * 0.75, x1: Wd * 0.75, y0: -Hh * 0.62 - Wd * 0.36 - 4, y1: Wd * 0.05 + 6 }, draw: (g, sh) => {
        blob(g, circles, BUSH, sh, 2);
        for (const [x, y] of dots) { g.beginPath(); g.arc(x, y, 3.4, 0, TAU); paint(g, dc, sh, 1.4); }
      } } };
    });
    addSpecies('fern', 3, r => {
      const fr = [];
      for (let k = 0; k < 6; k++) fr.push({ a: -1.25 + k / 5 * 2.5 + (r() - 0.5) * 0.2, L: 30 + r() * 16 });
      return { flex: 0.7, body: { bounds: { x0: -56, x1: 56, y0: -52, y1: 6 }, draw: (g, sh) => {
        for (const q of fr) {
          const p0 = { x: 0, y: 0 }, p2 = { x: Math.sin(q.a) * q.L, y: -Math.cos(q.a) * q.L * 0.75 }, p1 = { x: Math.sin(q.a) * q.L * 0.4, y: -q.L * 0.9 };
          g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y); g.lineWidth = 1.5; g.strokeStyle = INK; g.stroke();
          for (let t = 0.25; t < 0.95; t += 0.14) { const p = quadPt(p0, p1, p2, t); g.beginPath(); g.ellipse(p.x, p.y, 4.6 * (1.1 - t), 2.4, q.a + (t * 10 % 2 > 1 ? 0.9 : -0.9), 0, TAU); paint(g, GRASS_DK, sh, 1.3); }
        }
      } } };
    });
    addSpecies('bells', 3, r => {
      const h = 45 + r() * 20, col = r() < 0.5 ? WHITE : BLUE, side = r() < 0.5 ? 1 : -1;
      const p0 = { x: 0, y: 0 }, p1 = { x: side * 4, y: -h * 1.1 }, p2 = { x: side * h * 0.45, y: -h * 0.82 };
      return { flex: 0.8, body: { bounds: { x0: -h * 0.6 - 12, x1: h * 0.6 + 12, y0: -h * 1.1, y1: 6 }, draw: (g, sh) => {
        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y); g.lineWidth = 1.7; g.strokeStyle = INK; g.stroke();
        leafShape(g, 0, -h * 0.25, 16, side > 0 ? Math.PI + 0.6 : -0.6, GRASS, sh, 1.5);
        for (const t of [0.55, 0.75, 0.95]) { const p = quadPt(p0, p1, p2, t); g.beginPath(); g.moveTo(p.x - 5, p.y + 10); g.quadraticCurveTo(p.x - 5, p.y, p.x, p.y); g.quadraticCurveTo(p.x + 5, p.y, p.x + 5, p.y + 10); g.lineTo(p.x + 2, p.y + 8); g.lineTo(p.x, p.y + 11); g.lineTo(p.x - 2, p.y + 8); g.closePath(); paint(g, col, sh, 1.5); }
      } } };
    });
    addSpecies('sabra', 2, r => {
      const pads = [[0, -16, 10, 16, 0], [-10, -40, 8, 12, -0.45], [10, -38, 8.5, 12.5, 0.4], [1, -60, 7, 10, 0.05]];
      const fruit = [[-14, -52], [16, -50], [4, -72]];
      return { flex: 0.03, body: { bounds: { x0: -30, x1: 30, y0: -82, y1: 6 }, draw: (g, sh) => {
        for (const [x, y, rx, ry, a] of pads) { g.beginPath(); g.ellipse(x, y, rx, ry, a, 0, TAU); paint(g, TREE, sh, 1.8); }
        if (!sh) { g.fillStyle = INK; for (const [x, y] of pads) for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + (i - 1) * 4, y + (i % 2 ? -4 : 3), 0.9, 0, TAU); g.fill(); } }
        for (const [x, y] of fruit) { g.beginPath(); g.ellipse(x, y, 3.4, 4.6, 0, 0, TAU); paint(g, ORANGE, sh, 1.5); }
      } } };
    });
    const flowerSpecies = (name, n, headFn, opts = {}) => addSpecies(name, n, (r, i) => {
      const h = (opts.h || [45, 70])[0] + r() * ((opts.h || [45, 70])[1] - (opts.h || [45, 70])[0]);
      const lean = (r() - 0.5) * h * 0.4;
      const R = (opts.R || [10, 18])[0] + r() * ((opts.R || [10, 18])[1] - (opts.R || [10, 18])[0]);
      const leaves = [{ t: 0.3 + r() * 0.15, side: r() < 0.5 ? 1 : -1, L: R * 1.3 }];
      if (opts.twoLeaves || r() < 0.3) leaves.push({ t: 0.12 + r() * 0.1, side: -leaves[0].side, L: R * 1.1 });
      return { flex: opts.flex || 0.75, tip: { x: lean, y: -h }, body: { bounds: stemBounds(h, lean, R * 1.4), draw: stemDraw(h, lean, leaves, opts.lw || 2.3) }, head: headFn(r, R, i) };
    });
    flowerSpecies('daisy', 4, (r, R) => flatHead('daisy', R, WHITE));
    flowerSpecies('anemone', 4, (r, R) => flatHead('anemone', R, RED));
    flowerSpecies('five', 8, (r, R, i) => flatHead('five', R, [YEL, BLUE, PINK, ORANGE][i % 4]));
    flowerSpecies('tulip', 4, (r, R, i) => tulipHead(R, [PINK, RED, YEL, ORANGE][i % 4]), { twoLeaves: true });
    flowerSpecies('sunflower', 3, (r, R) => sunHead(R), { h: [85, 125], R: [16, 22], flex: 0.45, twoLeaves: true, lw: 2.6 });
    flowerSpecies('puff', 3, (r, R) => puffHead(R * 0.6), { h: [50, 72], R: [12, 16], flex: 1 });
    flowerSpecies('spike', 4, (r, R, i) => spikeHead(26 + r() * 12, i % 2 ? BLUE : PINK), { h: [35, 55], flex: 0.9 });
    // long-stemmed versions for the bouquet that fills the box
    const tall = { h: [110, 250], R: [17, 27], lw: 2.5, flex: 0.55 };
    flowerSpecies('s_daisy', 6, (r, R) => flatHead('daisy', R, WHITE), tall);
    flowerSpecies('s_anemone', 6, (r, R) => flatHead('anemone', R, RED), tall);
    flowerSpecies('s_five', 8, (r, R, i) => flatHead('five', R, [YEL, BLUE, PINK, ORANGE][i % 4]), tall);
    flowerSpecies('s_tulip', 4, (r, R, i) => tulipHead(R, [PINK, RED, YEL, ORANGE][i % 4]), { ...tall, twoLeaves: true });
    flowerSpecies('s_sun', 3, (r, R) => sunHead(R), { ...tall, R: [20, 26], twoLeaves: true });
    flowerSpecies('s_spike', 4, (r, R, i) => spikeHead(40 + r() * 16, i % 2 ? BLUE : PINK), tall);
    flowerSpecies('s_puff', 3, (r, R) => puffHead(R * 0.62), tall);
  }

  // render every variant into bitmaps at the current scale
  let SPR = 1;
  function raster(part) {
    const pad = 4, b = part.bounds, k = SPR;
    const w = Math.max(1, Math.ceil((b.x1 - b.x0 + pad * 2) * k)), h = Math.max(1, Math.ceil((b.y1 - b.y0 + pad * 2) * k));
    const mk = sh => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, (pad - b.x0) * k, (pad - b.y0) * k); part.draw(g, sh); return c; };
    part.img = mk(false); part.sil = mk(true); part.ax = pad - b.x0; part.ay = pad - b.y0;
  }
  function buildSprites() {
    SPR = DPR * sc * 1.25 * PLANT_K;
    for (const list of Object.values(SPECIES)) for (const v of list) {
      raster(v.body);
      if (!v.head) continue;
      raster(v.head);
      const b = v.body.bounds, h = v.head.bounds, tx = v.tip.x, ty = v.tip.y;
      v.full = v.full || { bounds: { x0: Math.min(b.x0, tx + h.x0), x1: Math.max(b.x1, tx + h.x1), y0: Math.min(b.y0, ty + h.y0), y1: Math.max(b.y1, ty + h.y1) },
        draw: (g, sh) => { v.body.draw(g, sh); g.save(); g.translate(tx, ty); v.head.draw(g, sh); g.restore(); } };
      raster(v.full);
    }
  }

  // ---------- how votes turn into flowers ----------
  // One note = one flower. Notes 1–30 fill the box; small grass patches sprout meanwhile.
  // From note 31 on, every note is a flower in a patch on the ground, and a patch grows
  // just enough to hold the flowers it has. The whole ground is green only at GOAL.
  const SLOT_MAX = 30, SPROUT_AT = [4, 9, 15, 21, 27];
  const GRID = 300, RMIN = 55;
  let patches = [], plants = [], voteFlower = [];
  const pwob = (p, a) => 1 + 0.06 * Math.sin(5 * a + p.ph1) + 0.035 * Math.sin(9 * a + p.ph2);

  const FLOWER_MIX = [['daisy', 0.2], ['anemone', 0.17], ['five', 0.25], ['tulip', 0.12], ['sunflower', 0.06], ['puff', 0.09], ['spike', 0.11]];
  function pickWeighted(r, mix) { let v = r(), acc = 0; for (const [k, w] of mix) { acc += w; if (v < acc) return k; } return mix[mix.length - 1][0]; }
  const blocked = pt => inPoly(pt, FOOT) || inPoly(pt, SHADOW_POLY);
  const hidden = pt => inPoly(pt, HULL) && !inFront(pt.x, pt.y);   // behind the box: fine for grass, not for a counted flower

  function genGarden() {
    const r = mulberry(20261027);
    patches = [];
    const rowH = GRID * 0.866 * ISO;
    const gx0 = Math.min(-520, view.x0 - 300), gx1 = Math.max(2440, view.x1 + 300);
    const gy0 = Math.min(-420, view.y0 - 200), gy1 = Math.max(1500, view.y1 + 200);
    for (let j = 0, y = gy0; y < gy1; j++, y += rowH)
      for (let x = gx0 + (j % 2) * GRID / 2; x < gx1; x += GRID)
        patches.push({ c: { x: x + (r() - 0.5) * GRID * 0.5, y: y + (r() - 0.5) * rowH * 0.5 }, rmax: 250 + r() * 70, ph1: r() * TAU, ph2: r() * TAU, rv: 0, vel: 0, wake: 0, flowers: [], votes: [] });

    // patches whose centre is on screen (and clear of the box) carry the counted flowers
    const onScreen = p => p.c.x > view.x0 + 20 && p.c.x < view.x1 - 20 && p.c.y > view.y0 + 10 && p.c.y < view.y1 - 10;
    const counted = patches.filter(p => onScreen(p) && !blocked(p.c) && !hidden(p.c));
    const deco = patches.filter(p => !counted.includes(p));
    counted.forEach(p => p.key = r()); counted.sort((a, b) => a.key - b.key);
    const anchor = { x: CENTER.x - 380, y: CENTER.y + 190 };
    const first = counted.reduce((b, p) => isoDist(p.c.x, p.c.y, anchor) < isoDist(b.c.x, b.c.y, anchor) ? p : b, counted[0]);
    counted.splice(counted.indexOf(first), 1); counted.unshift(first);

    plants = [];
    const add = (p, species, d, a, extra = {}) => {
      const x = p.c.x + d * Math.cos(a), y = p.c.y + d * Math.sin(a) * ISO;
      if (blocked({ x, y }) || (extra.vote === Infinity && hidden({ x, y }))) return null;
      const list = SPECIES[species];
      const pl = { patch: p, d, a, gx: x, gy: y, sp: species, v: list[Math.floor(r() * list.length)], k: 0.85 + r() * 0.35, flip: r() < 0.5 ? -1 : 1,
        front: inFront(x, y), born: undefined, delay: r() * 260, phase: r() * TAU, baseH: 0, calm: CALM.has(species), ...extra };
      plants.push(pl);
      return pl;
    };
    const spot = (p, maxFrac = 0.98) => ({ d: Math.sqrt(r()) * p.rmax * maxFrac, a: r() * TAU });

    // flower capacity per counted patch, by area, adding up to every note after the box
    const FIELD = GOAL - SLOT_MAX, area = counted.reduce((s2, p) => s2 + p.rmax * p.rmax, 0);
    let left = FIELD;
    counted.forEach((p, i) => { p.cap = i === counted.length - 1 ? left : Math.max(1, Math.round(FIELD * p.rmax * p.rmax / area)); left -= p.cap; });

    for (const p of patches) {
      const isCounted = p.cap !== undefined;
      const nFl = isCounted ? p.cap : 12;
      for (let i = 0, tries = 0; i < nFl && tries < nFl * 30; tries++) {
        const q = spot(p), pl = add(p, pickWeighted(r, FLOWER_MIX), q.d, q.a, { flower: true, vote: isCounted ? Infinity : -1 });
        if (pl) { p.flowers.push(pl); i++; }
      }
      p.flowers.sort((a, b) => a.d - b.d);
      for (let i = 0; i < 4; i++) add(p, 'grass', r() * 42, r() * TAU);          // so a fresh sprout isn't bare
      for (let i = 0; i < 12; i++) { const q = spot(p); add(p, 'grass', q.d, q.a); }
      for (let i = 0; i < 2; i++) { const q = spot(p); add(p, 'reed', q.d, q.a); }
      for (let i = 0; i < 3; i++) { const q = spot(p); add(p, 'clover', q.d, q.a); }
      if (r() < 0.6) { const q = spot(p); add(p, 'fern', q.d, q.a); }
      if (r() < 0.7) { const q = spot(p); add(p, 'bush', q.d, q.a); }
      if (r() < 0.3) { const q = spot(p); add(p, 'bells', q.d, q.a); }
      if (r() < 0.07) { const q = spot(p); add(p, 'sabra', q.d, q.a); }
    }
    plants.sort((a, b) => a.gy - b.gy);

    // schedule: which note becomes which flower
    voteFlower = [];
    const open = [];
    let next = 0;
    SPROUT_AT.forEach(v => { if (next < counted.length) { const p = counted[next++]; p.T = v; open.push(p); } });
    for (let v = SLOT_MAX + 1; v <= GOAL; v++) {
      const room = open.reduce((s2, p) => s2 + (p.flowers.length - p.votes.length), 0);
      if (next < counted.length && (room === 0 || r() < 0.075)) { const p = counted[next++]; p.T = v; open.push(p); }
      let pick = r() * open.reduce((s2, p) => s2 + (p.flowers.length - p.votes.length), 0), chosen = null;
      for (const p of open) { pick -= p.flowers.length - p.votes.length; if (pick < 0) { chosen = p; break; } }
      if (!chosen) continue;
      const fl = chosen.flowers[chosen.votes.length];
      fl.vote = v; chosen.votes.push(v); voteFlower[v] = fl;
    }
    // patches off screen or under the box fill in over the last part
    deco.forEach((p, k) => { p.T = Math.round(GOAL * 0.72 + (k / Math.max(1, deco.length)) * GOAL * 0.2); p.deco = true; });
    lawnDirty = true;
  }

  function patchTarget(p, v) {
    if (p.T === undefined || v < p.T) return 0;
    if (p.deco) return RMIN + (p.rmax - RMIN) * easeOut(clamp((v - p.T) / (GOAL - p.T)));
    let m = 0; while (m < p.votes.length && p.votes[m] <= v) m++;
    if (m === 0) return RMIN;
    if (m === p.flowers.length) return p.rmax + 10;
    return Math.max(RMIN, p.flowers[m - 1].d + 42);
  }

  // ---------- the bouquet that fills the box first ----------
  let slotPlants = [];
  function genSlot() {
    const r = mulberry(4242);
    const kinds = [['s_daisy', 0.24], ['s_anemone', 0.2], ['s_five', 0.22], ['s_tulip', 0.12], ['s_sun', 0.07], ['s_spike', 0.09], ['s_puff', 0.06]];
    slotPlants = [];
    for (let i = 0; i < SLOT_MAX; i++) {
      const t = i === 0 ? 0.5 : 0.08 + ((i * 0.618034 + 0.27) % 1) * 0.84;
      const S0 = lerpPt(SLOT_A, SLOT_B, t);
      const sp = i === 0 ? 's_daisy' : pickWeighted(r, kinds), list = SPECIES[sp];
      const spread = Math.min(1, 0.3 + i / 12);
      slotPlants.push({ at: i + 1, gx: S0.x, gy: S0.y + H_LID, baseH: H_LID, sp, v: list[Math.floor(r() * list.length)], k: 0.85 + r() * 0.3,
        flip: r() < 0.5 ? -1 : 1, fan: i === 0 ? 0 : ((t - 0.5) * 1.3 + (r() - 0.5) * 0.5) * spread, born: undefined, delay: 0, phase: r() * TAU });
    }
    slotPlants.sort((a, b) => a.gy - b.gy);
  }

  // ---------- wind ----------
  function windAt(x, y, t) {
    const base = Math.sin(t * 0.0013 + x * 0.005 + y * 0.003) * 0.35 + Math.sin(t * 0.0029 + x * 0.011) * 0.15;
    const span = 3400, front = ((t * 0.34) % span) - 800;          // a gust sweeping left → right
    const d = (x + y * 0.4) - front;
    return WIND * (0.05 * base + 0.2 * Math.exp(-(d * d) / (2 * 210 * 210)));
  }

  // ---------- sprite drawing ----------
  const DUR = { grass: 700, clover: 700, reed: 900, fern: 900, bush: 900, bells: 1000, sabra: 1100, tree: 1500 };
  // (m0 m1 m2 m3 m4 m5) · (l0 l1 l2 l3 lx ly) · sprite-pixel → device, without allocating
  function blit(g, part, sh, m0, m1, m2, m3, m4, m5, l0, l1, l2, l3, lx, ly) {
    const a = m0 * l0 + m2 * l1, b = m1 * l0 + m3 * l1, c = m0 * l2 + m2 * l3, d = m1 * l2 + m3 * l3;
    const e = m0 * lx + m2 * ly + m4, f = m1 * lx + m3 * ly + m5, k = SPR;
    g.setTransform(a / k, b / k, c / k, d / k, e - a * part.ax - c * part.ay, f - b * part.ax - d * part.ay);
    g.drawImage(sh ? part.sil : part.img, 0, 0);
  }
  // draws one plant (body or shadow) into g
  function drawPlant(g, p, now, sh, still) {
    const v = p.v, dur = DUR[p.sp] || 1100;
    const t = reduce || still ? 1 : clamp((now - p.born) / dur);
    if (t <= 0) return;
    const gy = elastic(t), gx = 1 + 0.3 * (1 - Math.min(1, gy));
    const w = (reduce || still || STILL || p.calm ? 0 : windAt(p.gx, p.gy, now) + Math.sin(now * 0.002 + p.phase) * 0.012 * WIND) * v.flex + (p.fan || 0);
    // frame → device, then the ground point, then (shadow) projection, then lift
    const K = BASE[0];
    let m0 = K, m1 = 0, m2 = 0, m3 = K, m4 = BASE[4] + K * p.gx, m5 = BASE[5] + K * p.gy;
    if (sh) { m2 = -K * V.x; m3 = -K * V.y; }
    if (p.baseH) { m4 -= m2 * p.baseH; m5 -= m3 * p.baseH; }
    // local: skew(w) · scale(sx, sy)
    const pk = p.baseH ? p.k : p.k * PLANT_K;   // the bouquet keeps its size relative to the box
    const sx = pk * p.flip * gx, sy = pk * gy;
    if (t >= 1 && v.full) { blit(g, v.full, sh, m0, m1, m2, m3, m4, m5, sx, 0, -w * sy, sy, 0, 0); return; }   // grown: stem + head in one image
    blit(g, v.body, sh, m0, m1, m2, m3, m4, m5, sx, 0, -w * sy, sy, 0, 0);
    if (v.head) {
      const th = reduce ? 1 : clamp((t - 0.38) / 0.62);
      if (th <= 0) return;
      const hs = elastic(th);
      const tx = sx * v.tip.x - w * sy * v.tip.y, ty = sy * v.tip.y;
      const rot = w * 0.8 + (reduce ? 0 : Math.sin(th * 14) * 0.35 * (1 - th));
      const cr = Math.cos(rot), sr = Math.sin(rot), hx = pk * p.flip * hs, hy = pk * hs;
      blit(g, v.head, sh, m0, m1, m2, m3, m4, m5, cr * hx, sr * hx, -sr * hy, cr * hy, tx, ty);
    }
  }
  const onScreen = p => p.gx > view.x0 - 420 && p.gx < view.x1 + 120 && p.gy > view.y0 - 60 && p.gy < view.y1 + 260;

  // Once a plant has finished growing, its shadow (and, for plants the wind doesn't move,
  // its body) is painted once into static layers. Removing anything repaints them.
  const CALM = new Set(['grass', 'clover', 'bush', 'sabra', 'fern']);
  const layers = { lawn: document.createElement('canvas'), sh: document.createElement('canvas'), back: document.createElement('canvas'), front: document.createElement('canvas') };
  const lg = {};
  let layersDirty = true;
  function sizeLayers() { for (const [k, c] of Object.entries(layers)) { c.width = cv.width; c.height = cv.height; lg[k] = c.getContext('2d'); } layersDirty = true; }
  function clearLayers() {
    for (const [k, c] of Object.entries(layers)) { lg[k].setTransform(1, 0, 0, 1, 0, 0); lg[k].clearRect(0, 0, c.width, c.height); }
    for (const p of plants) p.shCached = p.cached = false;
    layersDirty = false; lawnDirty = dirty = true;
  }
  function settle(p, now) {
    drawPlant(lg.sh, p, now, true, true);
    p.shCached = true;
    if (p.calm || STILL) { drawPlant(p.front ? lg.front : lg.back, p, now, false, true); p.cached = true; }
  }

  // Wind means redrawing every flower every frame. If the device can't hold ~40fps with it,
  // the wind stops: every plant goes into the static layers and an idle frame paints nothing.
  let STILL = reduce, dirty = true;
  const frameMs = [];
  let frameSum = 0;
  function watchSpeed(ms) {   // judged on the median of ~1.5s (or 60 frames) of windy frames
    if (STILL || document.hidden || ms > 1500) return;
    frameMs.push(ms); frameSum += ms;
    if (frameMs.length < 60 && frameSum < 1500) return;
    const median = frameMs.sort((a, b) => a - b)[frameMs.length >> 1];
    frameMs.length = 0; frameSum = 0;
    if (median > 24) { STILL = true; layersDirty = true; }
  }

  // ---------- state ----------
  // target: the real count (live, or simulated from the review panel). The garden (nGrow)
  // chases it one flower at a time; big jumps (first load, presets) bloom in all at once.
  let target = 0, nGrow = 0, inflight = 0, lastLaunch = 0, lastT = performance.now();
  let pending = null;            // own note sent, waiting for the server
  let voted = false;             // one note per page load
  const papers = [], seeds = [], rings = [];
  const numEl = document.getElementById('num');
  const shown = () => pending ? Math.max(target, pending.base + 1) : target;
  function showCount() { const v = shown(); numEl.textContent = v.toLocaleString('en-US'); syncPanel(v); }
  function setTarget(v) {
    target = Math.max(0, Math.round(v));
    if (pending && target > pending.base) pending = null;
    showCount();
  }
  function bloomTo(v, now) {      // jump the garden, with patches waking at different moments
    seeds.length = 0; inflight = 0;
    nGrow = v;
    patches.forEach(p => { if (patchTarget(p, v) > 0 && p.rv < 1) p.wake = now + Math.random() * 900; });
  }

  // ---------- vote: note → slot → (box full? seed → flower in a patch) ----------
  const PAPER_H = 150, PAPER_MS = 720, SEED_MS = 760;
  function castVote() {
    if (voted && !sim) return;
    if (!sim) {
      voted = true; boxBtn.disabled = true; boxBtn.setAttribute('aria-label', 'הפתק שלך כבר בקלפי');
      setTimeout(() => shareEl.classList.add('nudge'), FLY_MS + PAPER_MS + 500);   // next step: pass it on
    }
    if (reduce) { if (!sim) hideNote(); return sendVote(); }
    if (throwNote()) return;                      // the note flies to the slot, then drops in as a paper
    papers.push({ t0: performance.now(), msg: pickMessage(), font: labelFont() });
  }
  function sendVote() {
    if (sim) { setTarget(target + 1); return; }
    pending = { base: target };
    showCount();
    COUNTER.vote().catch(() => { pending = null; showCount(); });
  }
  function growOne(now) {
    const v = nGrow + inflight + 1;
    const fl = voteFlower[v];
    if (v <= SLOT_MAX || !fl || reduce) { nGrow++; return; }
    const from = lerpPt(SLOT_A, SLOT_B, 0.5);
    seeds.push({ t0: now, from: { x: from.x, y: from.y + H_LID }, to: { x: fl.gx, y: fl.gy }, patch: fl.patch });
    inflight++;
  }
  function paperQuad(d, sh) {
    const hb = Math.max(d, 0), ht = d + PAPER_H;
    if (ht <= 0) return null;
    const S0 = lerpPt(SLOT_A, SLOT_B, 0.24), S1 = lerpPt(SLOT_A, SLOT_B, 0.76);
    const pt = (Sp, h) => sh ? { x: Sp.x + (H_LID + h) * V.x, y: Sp.y + H_LID + (H_LID + h) * V.y } : { x: Sp.x, y: Sp.y - h };
    return [pt(S0, hb), pt(S1, hb), pt(S1, ht), pt(S0, ht)];
  }
  function setFrame() { ctx.setTransform(BASE[0], BASE[1], BASE[2], BASE[3], BASE[4], BASE[5]); }
  function drawPaper(pp, now, sh) {
    const t = clamp((now - pp.t0) / PAPER_MS), d = 230 - (230 + PAPER_H) * t * t;
    const q = paperQuad(d, sh); if (!q) return;
    setFrame(); ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    paint(ctx, WHITE, sh, 2.5 * LINE_K);
    if (sh || !pp.msg) return;
    // the message, upright in the paper's plane (x along the slot, y down), clipped to what's above the slot
    const S0 = lerpPt(SLOT_A, SLOT_B, 0.24), S1 = lerpPt(SLOT_A, SLOT_B, 0.76);
    const L = Math.hypot(S1.x - S0.x, S1.y - S0.y), ux = (S1.x - S0.x) / L, uy = (S1.y - S0.y) / L, k = BASE[0];
    const cx = (S0.x + S1.x) / 2, cy = (S0.y + S1.y) / 2 - d - PAPER_H / 2;
    ctx.save(); ctx.clip();
    ctx.setTransform(k * ux, k * uy, 0, k, BASE[4] + k * cx, BASE[5] + k * cy);
    ctx.fillStyle = INK; ctx.font = `700 ${NOTE.font}px ${pp.font || 'sans-serif'}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
    const lines = wrapWords(ctx, pp.msg, L * 0.86), lh = NOTE.font * 1.05;
    lines.forEach((ln, i) => ctx.fillText(ln, 0, (i - (lines.length - 1) / 2) * lh));
    ctx.restore();
  }
  function wrapWords(g, text, maxW) {
    const lines = [];
    for (const w of text.split(' ')) {
      const last = lines[lines.length - 1];
      if (last !== undefined && g.measureText(last + ' ' + w).width <= maxW) lines[lines.length - 1] = last + ' ' + w;
      else lines.push(w);
    }
    return lines;
  }
  function seedPos(sd, now) {
    const t = clamp((now - sd.t0) / SEED_MS), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const g = lerpPt(sd.from, sd.to, e);
    const h = (H_LID + 30) * (1 - t) + 380 * 4 * t * (1 - t);
    return { g, h, t };
  }
  function drawSeed(sd, now, sh) {
    const { g, h } = seedPos(sd, now);
    setFrame();
    ctx.beginPath();
    if (sh) ctx.ellipse(g.x + h * V.x, g.y + h * V.y, 9, 9 * ISO, 0, 0, TAU);
    else ctx.ellipse(g.x, g.y - h, 9, 11, 0, 0, TAU);
    paint(ctx, WHITE, sh, 2.5 * LINE_K);
  }

  // ---------- lawn ----------
  function lawnPath(g, p, dy) {
    const R = p.rv;
    for (let i = 0; i <= 64; i++) {
      const a = i / 64 * TAU, rr = R * pwob(p, a);
      const x = p.c.x + rr * Math.cos(a), y = p.c.y + rr * Math.sin(a) * ISO + dy;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  }
  // the lawn has its own layer, repainted only when a patch's radius moved
  let lawnDirty = true;
  const lawnOnScreen = p => p.c.x + p.rv * 1.12 > view.x0 && p.c.x - p.rv * 1.12 < view.x1 && p.c.y + p.rv * 0.66 + 18 > view.y0 && p.c.y - p.rv * 0.66 < view.y1;
  function drawLawn(active) {
    if (lawnDirty) {
      const g = lg.lawn, vis = active.filter(lawnOnScreen);
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, layers.lawn.width, layers.lawn.height);
      if (vis.length) {
        g.setTransform(BASE[0], BASE[1], BASE[2], BASE[3], BASE[4], BASE[5]);
        g.beginPath(); vis.forEach(p => lawnPath(g, p, 13)); g.fillStyle = INK; g.fill();           // turf edge
        g.beginPath(); vis.forEach(p => lawnPath(g, p, 0)); g.lineWidth = 5; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke();
        g.fillStyle = LAWN; g.fill();                                                                // one outline around the union
      }
      for (const p of patches) p.drawnRv = p.rv;
      lawnDirty = false;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layers.lawn, 0, 0);
  }

  // ---------- frame ----------
  let countColor = '';
  function frame(now) {
    const ms = now - lastT, dt = Math.min(100, ms) / 1000, steps = Math.ceil(dt * 60); lastT = now;   // springs step at 60Hz even when frames are slow
    placeNote(now, dt);

    for (let i = papers.length - 1; i >= 0; i--) if (now - papers[i].t0 > PAPER_MS) { papers.splice(i, 1); sendVote(); }
    for (let i = seeds.length - 1; i >= 0; i--) if (now - seeds[i].t0 > SEED_MS) {
      const sd = seeds.splice(i, 1)[0]; nGrow++; inflight--;
      sd.patch.vel += 220; rings.push({ t0: now, at: sd.to });
    }
    // the garden chases the count
    const gap = target - nGrow - inflight;
    if (gap > 12) bloomTo(target, now);
    else if (gap > 0 && now - lastLaunch > 170) { growOne(now); lastLaunch = now; }
    else if (gap < 0) bloomTo(target, now);

    // patch springs
    const active = [];
    for (const p of patches) {
      const target = now < p.wake ? 0 : patchTarget(p, nGrow);
      if (reduce) p.rv = target;
      else {
        for (let k = 0, h = dt / steps; k < steps; k++) { p.vel += (95 * (target - p.rv) - 11 * p.vel) * h; p.rv += p.vel * h; }
        if (target === 0 && p.rv < 2) { p.rv = 0; p.vel = 0; }
        else if (Math.abs(target - p.rv) < 0.4 && Math.abs(p.vel) < 4) { p.rv = target; p.vel = 0; }   // at rest
      }
      if (Math.abs(p.rv - (p.drawnRv || 0)) > 0.05) lawnDirty = true;
      p.target = target;
      if (p.rv > 1) active.push(p);
    }

    // which plants are out: counted flowers by their note, everything else by the patch edge
    const live = [];
    if (layersDirty) clearLayers();
    for (const p of plants) {
      const pr = p.patch, edge = pwob(pr, p.a);
      let out;
      if (p.flower && p.vote > 0) out = p.vote <= nGrow && (pr.rv > 1 || p.born !== undefined);
      else out = p.born !== undefined ? p.d < pr.target * edge + 4 : p.d + 12 < pr.rv * edge;
      if (!out) { if (p.shCached) layersDirty = true; else if (p.born !== undefined) dirty = true; p.born = undefined; continue; }
      if (p.born === undefined) p.born = Math.max(now, pr.wake) + (p.vote === nGrow ? 0 : p.delay);
      if (!onScreen(p)) continue;

  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !canHover.matches) return;
    mouse = { x: e.clientX, y: e.clientY, box: e.target === boxBtn, ui: overUI(e.target), out: false };
    if (note.mode === 'rest') note.mode = 'follow';
    const on = note.mode === 'follow' && !mouse.ui;
    noteEl.classList.toggle('off', note.mode === 'follow' && mouse.ui);
    root.classList.toggle('following', on);
  });
  root.addEventListener('mouseleave', () => {
    if (mouse) mouse.out = true;
    if (note.mode === 'follow') note.mode = 'rest';
    noteEl.classList.remove('off'); root.classList.remove('following');
  });
  addEventListener('click', e => {
    if ((note.mode === 'follow' || note.mode === 'rest') && e.target !== boxBtn && !overUI(e.target) && !noteEl.contains(e.target)) note.shake = performance.now();
  });
  // touch: drag the note into the box, or just tap it
  noteEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || note.mode !== 'rest') return;
    noteEl.setPointerCapture(e.pointerId);
    note.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, dx: note.x - e.clientX, dy: note.y - e.clientY };
    note.mode = 'drag';
  });
  noteEl.addEventListener('pointermove', e => { if (note.drag && e.pointerId === note.drag.id) { note.drag.x = e.clientX; note.drag.y = e.clientY; } });
  const endDrag = (e, cancel) => {
    const d = note.drag; if (!d || e.pointerId !== d.id) return;
    note.drag = null; note.mode = 'rest';
    if (cancel) return;
    const r = boxBtn.getBoundingClientRect(), tap = Math.hypot(d.x - d.x0, d.y - d.y0) < 10;
    if (tap || (d.x > r.left && d.x < r.right && d.y > r.top && d.y < r.bottom)) castVote();
  };
  noteEl.addEventListener('pointerup', e => endDrag(e, false));
  noteEl.addEventListener('pointercancel', e => endDrag(e, true));

  // ---------- boot ----------
  defineSpecies();
  newNote();
  layout();
  genGarden();
  genSlot();
  if (LIVE) {
    let last = null;
    try { last = JSON.parse(localStorage.getItem('kalpi-count')); } catch (e) {}
    if (Number.isFinite(last)) { setTarget(last); markKnown(); }
    setTimeout(markKnown, 8000);   // never hide the counter for good
  } else counterEl.classList.remove('waiting');
  showCount();
  syncMode();
  initFonts();
  requestAnimationFrame(frame);
})();
</script>
